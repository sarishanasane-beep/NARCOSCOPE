<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NARCOSCOPE — Investigation Workstation</title>
<style>
/* ============================================================
   NARCOSCOPE design system — professional investigation UI
   ============================================================ */
:root{
  --bg:#0b0e17; --bg2:#0e1220; --panel:#131827; --panel2:#171d2f; --panel3:#1b2236;
  --line:#232b44; --line2:#2e3857;
  --text:#dbe2f4; --text2:#aab4d6; --muted:#7c86a8;
  --accent:#5b8cff; --accent2:#7aa2ff; --accent-dim:rgba(91,140,255,.12);
  --ok:#3ecf8e; --warn:#f0a63c; --bad:#ef5b5b;
  --cand:#e0a63c; --trusted:#3ecf8e; --rejected:#8a5560;
  --node-person:#5b8cff; --node-org:#3ecf8e; --node-loc:#35c2c8;
  --node-event:#b07cff; --node-case:#f0a63c; --node-other:#8a93b8;
  --radius:10px; --radius-sm:7px;
  --sidebar-w:236px; --topbar-h:56px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Inter",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--font)}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:.2px}
::selection{background:rgba(91,140,255,.3)}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .18s ease;flex-shrink:0;z-index:40}
#sidebar.collapsed{width:64px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:var(--topbar-h);background:rgba(14,18,32,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:30}
#content{flex:1;padding:20px 22px 60px;max-width:1500px;width:100%}

/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8a5bff);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;letter-spacing:1px;flex-shrink:0}
.brand .name{font-size:14px;font-weight:750;letter-spacing:3px;white-space:nowrap}
.brand .name small{display:block;font-size:9px;color:var(--muted);letter-spacing:1.5px;font-weight:600}
.side-collapse{display:flex;align-items:center;justify-content:center;padding:8px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:16px}
nav.side{padding:10px 8px;overflow-y:auto;flex:1}
nav.side .sec{font-size:10px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;padding:14px 10px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:none;background:transparent;color:var(--text2);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:600;text-align:left;margin:1px 0;white-space:nowrap;transition:background .12s,color .12s}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent2)}
.nav-item .ico{width:18px;text-align:center;font-size:14px;flex-shrink:0}
.nav-item .lbl{overflow:hidden;text-overflow:ellipsis}
#sidebar.collapsed .nav-item .lbl,#sidebar.collapsed .sec,#sidebar.collapsed .brand .name,#sidebar.collapsed .brand small{display:none}
#sidebar.collapsed .nav-item{justify-content:center;padding:10px}
#sidebar.collapsed .brand{justify-content:center;padding:12px 8px}

/* ---------- topbar ---------- */
.search-trigger{flex:1;max-width:520px;position:relative}
.search-trigger input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 34px 8px 34px;font-size:13px;outline:none}
.search-trigger input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search-trigger .s-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.search-trigger .s-kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;font-family:var(--mono)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.top-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--text2);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer}
.top-btn:hover{border-color:var(--line2);color:var(--text)}
.top-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.workspace-pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;font-size:12px;cursor:pointer;color:var(--text2);max-width:230px}
.workspace-pill:hover{border-color:var(--line2)}
.workspace-pill .w-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px 4px 4px;font-size:12px;color:var(--text2)}
.user-chip .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#3a4a7a,#5b8cff);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}

/* ---------- panels & cards ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel h2,.panel h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:700}
.panel h3{margin-bottom:8px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:22px;letter-spacing:.4px}
.page-head .crumb{font-size:12px;color:var(--muted);margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden}
.kpi .num{font-size:26px;font-weight:750;letter-spacing:.3px}
.kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;margin-top:3px}
.kpi .num small{font-size:13px;color:var(--muted);font-weight:600}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.55}
.kpi.green::after{background:var(--ok)}
.kpi.amber::after{background:var(--warn)}
.kpi.purple::after{background:var(--node-event)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}

/* ---------- tables / lists ---------- */
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th{text-align:left;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line2);font-weight:700}
table.list td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr:hover td{background:rgba(255,255,255,.02)}
table.list tr.clickable{cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;transition:border-color .12s}
.card:hover{border-color:var(--line2)}
.card .t{font-size:14px;font-weight:650}
.card .s{font-size:12px;color:var(--muted);margin-top:3px}
.card .m{font-size:12px;color:var(--text2);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:750;letter-spacing:.6px;text-transform:uppercase;border:1px solid transparent}
.badge.PENDING,.badge.EDITED,.badge.CANDIDATE{background:rgba(240,166,60,.13);color:#f2bd6b;border-color:rgba(240,166,60,.35)}
.badge.CONFIRMED,.badge.ACTIVE,.badge.TRUSTED,.badge.PROCESSED{background:rgba(62,207,142,.13);color:#5fd9a4;border-color:rgba(62,207,142,.35)}
.badge.REJECTED{background:rgba(239,91,91,.13);color:#f08a8a;border-color:rgba(239,91,91,.35)}
.badge.MAJOR{background:rgba(239,91,91,.14);color:#f08a8a;border-color:rgba(239,91,91,.4)}
.badge.MODERATE{background:rgba(240,166,60,.14);color:#f2bd6b;border-color:rgba(240,166,60,.4)}
.badge.MINOR{background:rgba(124,134,168,.14);color:#a8b2d4;border-color:rgba(124,134,168,.4)}
.badge.neutral{background:rgba(124,134,168,.12);color:#a8b2d4;border-color:rgba(124,134,168,.3)}
.badge.type{background:rgba(91,140,255,.12);color:#8fb0ff;border-color:rgba(91,140,255,.3)}
.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--panel3);color:var(--text2);border:1px solid var(--line)}
.trust-chip{font-size:10px;font-weight:750;letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:6px}
.trust-chip.trusted{background:rgba(62,207,142,.12);color:#5fd9a4;border:1px solid rgba(62,207,142,.35)}
.trust-chip.candidate{background:rgba(240,166,60,.12);color:#f2bd6b;border:1px solid rgba(240,166,60,.35)}

/* ---------- forms ---------- */
label{display:block;font-size:11px;color:var(--muted);margin:12px 0 4px;letter-spacing:.5px;font-weight:600}
input,select,textarea{width:100%;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-size:13px;font-family:var(--font);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
input:disabled,select:disabled{opacity:.5;cursor:not-allowed}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
textarea{min-height:70px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--line2);background:var(--panel3);color:var(--text);font-size:12.5px;font-weight:650;cursor:pointer;transition:filter .12s,background .12s,border-color .12s}
.btn:hover{filter:brightness(1.12)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:rgba(62,207,142,.15);border-color:rgba(62,207,142,.5);color:#5fd9a4}
.btn.bad{background:rgba(239,91,91,.13);border-color:rgba(239,91,91,.45);color:#f08a8a}
.btn.warn{background:rgba(240,166,60,.13);border-color:rgba(240,166,60,.45);color:#f2bd6b}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--text2)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab-btn{padding:8px 14px;font-size:12.5px;font-weight:650;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent2);border-bottom-color:var(--accent)}

/* ---------- detail ---------- */
.detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.detail-header h1{font-size:24px}
.detail-header .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.kv{font-size:12.5px;color:var(--muted);margin:3px 0}
.kv b{color:var(--text);font-weight:650}
.kv .mono{font-family:var(--mono);font-size:12px}
.section-title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:750;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}
.evidence{font-size:12.5px;font-style:italic;color:#c3cdee;border-left:3px solid var(--accent);padding:7px 11px;margin:7px 0;background:rgba(91,140,255,.05);border-radius:0 6px 6px 0}
.confidence-note{font-size:11.5px;color:var(--muted);margin:7px 0;line-height:1.5}

/* ---------- states ---------- */
.state{padding:34px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--radius);background:var(--panel);font-size:13px}
.state .ico{font-size:26px;margin-bottom:8px}
.state .act{margin-top:12px}
.skel{background:linear-gradient(90deg,var(--panel) 25%,var(--panel3) 50%,var(--panel) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:6px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spinner{width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-4px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:8px;padding:11px 14px;font-size:13px;box-shadow:var(--shadow);max-width:420px;animation:tin .2s ease}
.toast.ok{border-left-color:var(--ok)}
.toast.bad{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- search overlay ---------- */
#searchOverlay{position:fixed;inset:0;background:rgba(5,7,14,.72);backdrop-filter:blur(4px);z-index:100;display:none}
#searchOverlay.open{display:block}
.search-panel{max-width:680px;margin:70px auto 0;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.search-panel .sp-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.search-panel .sp-head input{flex:1;border:none;background:transparent;color:var(--text);font-size:15px;padding:6px 0;box-shadow:none}
.search-panel .sp-head input:focus{box-shadow:none}
.search-panel .sp-body{max-height:460px;overflow-y:auto;padding:8px}
.search-group-title{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px;font-weight:750}
.sr{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:none;background:transparent;color:var(--text);border-radius:8px;cursor:pointer;text-align:left}
.sr:hover{background:rgba(255,255,255,.04)}
.sr.active{background:var(--accent-dim)}
.sr .name{font-size:13.5px;font-weight:650}
.sr .sub{font-size:11px;color:var(--muted);margin-top:1px}
.sr .badge{margin-left:auto;flex-shrink:0}
.sr .empty{color:var(--muted);padding:14px;text-align:center;font-size:13px}
.sp-foot{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-radius:4px;padding:1px 5px;background:var(--bg2)}

/* ---------- graph ---------- */
/* The graph is sized to its own panel (REQ 34/35): a large responsive
   area with internal camera zoom/pan — no page-level scrolling, no
   scrollbars (overflow hidden; the camera viewBox is the viewport). */
.graph-wrap{background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:10px;margin:10px 0;position:relative;touch-action:none;height:clamp(560px,74vh,880px)}
.graph-wrap svg{display:block;width:100%;height:100%;min-width:0}
.graph-wrap.dragging{cursor:grabbing}
/* Edge labels: always readable (REQ 21-24), brighten on hover/selection.
   The stroke halo keeps text legible over crossing edges. */
.g-edge{cursor:pointer}  .g-edge text.edge-label{opacity:.85;transition:opacity .12s ease;font-size:12px;font-weight:600;fill:#b6bfdd;paint-order:stroke;stroke:rgba(6,8,16,.95);stroke-width:4px;letter-spacing:.3px}
  .g-edge:hover text.edge-label{opacity:1;fill:#e8edfb}
/* Analytical accordions (REQ 15/16/19-21): collapsed by default, lazy
   content, accessible toggle headers. */
.acc{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel);margin-bottom:10px;overflow:hidden}
.acc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 14px;background:var(--panel3);border:none;color:var(--text2);font-size:13px;font-weight:750;cursor:pointer;text-align:left}
.acc-head:hover{color:var(--text);background:rgba(91,140,255,.08)}
.acc-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.acc-head .acc-arrow{font-size:10px;color:var(--accent2);transition:transform .15s ease}
.acc-body{padding:12px 14px;border-top:1px solid var(--line)}
.acc-note{font-size:11px;color:var(--muted);margin-top:10px}
/* Analysis scope toggle (REQ 14): Current Case is the default; global
   analysis is an explicit opt-in — never a silent mix. */
.scope-toggle{display:inline-flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:var(--radius-sm);padding:6px 10px;background:var(--panel3)}
.scope-toggle label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.scope-toggle input{cursor:pointer}
.ana-scope-line{font-size:11px;color:var(--muted)}
.hop-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.hop-bar button{background:var(--panel3);color:var(--text2);border:1px solid var(--line2);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:12px;font-weight:600}
.hop-bar button.active{background:rgba(91,140,255,.18);border-color:var(--accent);color:var(--accent2)}  .hop-note{font-size:11.5px;color:var(--muted)}
  .net-center{background:var(--panel3);border:1px solid var(--line2);border-radius:var(--radius-sm);padding:10px 12px;margin-top:10px}
  .net-center .lbl{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent2);font-weight:800;margin-bottom:3px}
  .net-center .nm{font-size:13px;font-weight:700;color:var(--text);word-break:break-word}
  .net-center .tp{font-size:11.5px;color:var(--muted);margin-top:2px}
  .case-head{background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px}
  .case-head .case-ttl{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--accent2);font-weight:800}
  .case-head .case-name{font-size:17px;font-weight:800;color:var(--text);margin-top:3px}
  .case-head .case-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .case-head .case-counts{font-size:12.5px;color:var(--text);margin-top:6px;font-weight:600}
  .filter-active{display:inline-block;background:rgba(159,183,255,.14);border:1px solid var(--accent);color:var(--accent2);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;padding:2px 8px;border-radius:var(--radius-sm);margin-right:8px}
  .net-graph-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
  .net-graph-head .ttl{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent2);font-weight:800}
  .net-graph-head .ctr{font-size:12.5px;color:var(--muted)}
  .net-graph-head .ctr b{color:var(--text);font-weight:650}
  .net-graph-head .stt{font-size:11.5px;color:var(--muted)}
.prov-box{margin-top:10px;padding:12px;border:1px solid #33406b;border-radius:8px;background:var(--bg2);font-size:12.5px}
.prov-box h4{margin:0 0 8px;color:var(--warn);font-size:12px;letter-spacing:.5px}
.legend{font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:currentColor}

/* ---------- candidates ---------- */

<!-- Pure graph-layout core: deterministic, DOM-free so it can be unit-tested
     with plain Node (frontend/test_graph_layout.js). Renders full wrapped
     node names, layers nodes by graph distance from the case root, keeps
     labels in the inter-ring gaps, and derives a bounding box that includes
     labels + badges so Fit-to-view never clips anything. -->
<script id="layoutCore">
"use strict";
function graphLayoutWrap(name) {
  const s = String(name || "(unnamed)");
  const MAX = 15;
  if (s.length <= MAX) return [s];
  // Prefer the break that BALANCES the two lines (readable + compact);
  // a long single word is hard-split at MAX as the fallback.
  let best = -1, bestScore = Infinity;
  for (let i = 5; i < s.length - 4; i++) {
    if (s[i] === " ") {
      const score = Math.abs(i - s.length / 2);
      if (score < bestScore) { bestScore = score; best = i; }
    }
  }
  if (best > 0) return [s.slice(0, best).trim(), s.slice(best).trim()];
  const cut = Math.min(MAX, s.length - 1);
  return [s.slice(0, cut).trim(), s.slice(cut).trim()];
}
function graphLabelDims(name) {
  const lines = graphLayoutWrap(name);
  const w = Math.max(30, Math.max.apply(null, lines.map((l) => l.length)) * GRAPH_CHAR_W);
  return { lines, w, h: lines.length * GRAPH_LINE_H };
}
const GRAPH_TYPE_ORDER = { CASE: 0, ORGANIZATION: 1, AGENCY: 1, PERSON: 2, LOCATION: 3, DRUG: 4, VEHICLE: 5, EVENT: 6, OTHER: 7 };
const GRAPH_NODE_R = 22;
const GRAPH_CASE_R = 30;
const GRAPH_CHAR_W = 8;     // estimated glyph width at the 16px node-label font
const GRAPH_LINE_H = 20;    // line height for 16px node labels
const GRAPH_RING_GAP = 20;    // angular gap between node slots on a ring
const GRAPH_RING_STEP = 108;  // radial pitch between rings (node + outward label + badge + gap)
const GRAPH_ISO_PER_RING = 6; // contextual / isolated nodes per outer ring

/** Deterministic RADIAL layout — an investigative network, not a
 *  force-directed scatter (REQ 2-6, 30).
 *
 *  - the center entity/case sits at the origin and is visually dominant,
 *  - BFS graph distance from the center decides the ring (never an
 *    invented relationship — depth is positioning only): ring 1 = direct
 *    relationships, ring 2 = one hop further, etc.
 *  - nodes within a ring are ordered deterministically (type/name, then
 *    an angular-barycenter heuristic so edges stay short and crossings
 *    stay low), then spread at even angular intervals; the ring radius
 *    grows until full wrapped labels fit around the circumference,
 *  - labels are placed OUTWARD from the ring (never across the node
 *    circle) and never overlap their own node,
 *  - nodes with NO path to the center (contextual / mentioned-only /
 *    declared-but-unlinked) go to dedicated OUTER rings — separated by
 *    connectivity, never by type,
 *  - the bounding box includes every circle, wrapped label and badge so
 *    the camera view never clips anything.
 *
 * Returns positions, label dims, per-node layer, label boxes/metadata,
 * the isolated set and a bounds box. Pure and DOM-free so it can be
 * unit-tested in plain Node.
 */
function graphLayout({ nodes, edges, centerId }) {
  const list = nodes || [];
  const dims = {};
  list.forEach((n) => { dims[n.id] = graphLabelDims(n.name); });
  const ids = new Set(list.map((n) => n.id));
  const visibleEdges = (edges || []).filter((e) => ids.has(e.source) && ids.has(e.target));
  const adj = new Map();
  visibleEdges.forEach((e) => {
    if (!adj.has(e.source)) adj.set(e.source, new Set());
    if (!adj.has(e.target)) adj.set(e.target, new Set());
    adj.get(e.source).add(e.target);
    adj.get(e.target).add(e.source);
  });
  const dist = new Map([[centerId, 0]]);
  const queue = [centerId];
  while (queue.length) {
    const u = queue.shift();
    const du = dist.get(u) + 1;
    (adj.get(u) || []).forEach((v) => {
      if (!dist.has(v)) { dist.set(v, du); queue.push(v); }
    });
  }
  const layers = new Map();
  list.forEach((n) => {
    const d = n.id === centerId ? 0 : (dist.has(n.id) ? dist.get(n.id) : -1);
    if (!layers.has(d)) layers.set(d, []);
    layers.get(d).push(n);
  });
  const rank = (n) => (GRAPH_TYPE_ORDER[n.type] == null ? 7 : GRAPH_TYPE_ORDER[n.type]);
  const byName = (a, b) => String(a.name || "").localeCompare(String(b.name || ""));
  const slotW = (n) => Math.max(dims[n.id].w, 2 * GRAPH_NODE_R);
  const maxD = Math.max(0, ...[...layers.keys()].filter((d) => d > 0));

  // Deterministic circular ordering: type/name first, then 4 passes of the
  // angular-barycenter heuristic — each node gravitates toward the mean
  // angle of its neighbours so edges stay short and crossings stay low.
  function orderRing(arr) {
    let order = [...arr].sort((a, b) => rank(a) - rank(b) || byName(a, b));
    for (let pass = 0; pass < 4; pass++) {
      const n = order.length;
      const step = (2 * Math.PI) / n;
      const ang = new Map();
      order.forEach((nd, i) => ang.set(nd.id, -Math.PI / 2 + i * step));
      const target = new Map();
      order.forEach((nd) => {
        const nb = adj.get(nd.id) || new Set();
        let sx = 0, sy = 0, cnt = 0;
        nb.forEach((v) => {
          const a = ang.get(v);
          if (a != null) { sx += Math.cos(a); sy += Math.sin(a); cnt++; }
        });
        target.set(nd.id, cnt ? Math.atan2(sy, sx) : ang.get(nd.id));
      });
      order = [...order].sort((a, b) => target.get(a.id) - target.get(b.id) || rank(a) - rank(b) || byName(a, b));
    }
    return order;
  }
  const orderRings = new Map();
  layers.forEach((l, d) => { if (d > 0) orderRings.set(d, orderRing(l)); });
  const isoList = [...(layers.get(-1) || [])].sort((a, b) => rank(a) - rank(b) || byName(a, b));

  const pos = {}, layerOf = {}, labelBox = {}, labelMeta = {};
  pos[centerId] = { x: 0, y: 0 };
  layerOf[centerId] = 0;

  // Outward label placement: text always reads AWAY from the center and
  // never across its own node circle. Top/bottom nodes centre their label;
  // side nodes left/right-align it so it only ever extends off the ring
  // (self-overlap is impossible; neighbour spacing is sized by label width).
  function placeRing(arr, ringR, ringIndex) {
    const n = arr.length;
    const step = (2 * Math.PI) / n;
    const start = -Math.PI / 2 + (n % 2) * (Math.PI / Math.max(2, n));
    arr.forEach((nd, i) => {
      const a = start + i * step;
      const x = ringR * Math.cos(a), y = ringR * Math.sin(a);
      pos[nd.id] = { x, y };
      layerOf[nd.id] = ringIndex;
      const d = dims[nd.id];
      const cx = Math.cos(a), sy = Math.sin(a);
      let meta;
      if (Math.abs(cx) > 0.62) {
        const dirx = cx > 0 ? 1 : -1;
        const tx = x + dirx * (GRAPH_NODE_R + 9);
        meta = { x: tx, y, anchor: dirx > 0 ? "start" : "end", dir: dirx, below: true };
      } else {
        const below = sy > 0;
        const ty = y + (below ? 1 : -1) * (GRAPH_NODE_R + 9);
        meta = { x, y: ty, anchor: "middle", dir: below ? 1 : -1, below };
      }
      const top = meta.below ? meta.y : meta.y - d.h;
      const base = meta.below ? meta.y + GRAPH_LINE_H : meta.y - (d.lines.length - 1) * GRAPH_LINE_H;
      labelMeta[nd.id] = { cx: meta.x, base, anchor: meta.anchor, dir: meta.dir, below: meta.below };
      labelBox[nd.id] = { x: meta.x - (meta.anchor === "middle" ? d.w / 2 : 0), y: top, w: d.w, h: d.h, dir: meta.dir };
    });
  }

  let R = 0;
  for (let d = 1; d <= maxD; d++) {
    const arr = orderRings.get(d);
    if (!arr || !arr.length) continue;
    const circ = arr.reduce((acc, nd) => acc + slotW(nd) + GRAPH_RING_GAP, 0);
    R = Math.max(R + GRAPH_RING_STEP, circ / (2 * Math.PI));
    placeRing(arr, R, d);
  }
  // The center's label sits ABOVE the root (nothing sits above it).
  {
    const d = dims[centerId];
    const top = pos[centerId].y - GRAPH_CASE_R - 12 - d.h;
    labelMeta[centerId] = { cx: pos[centerId].x, base: top + d.h, anchor: "middle", dir: -1, below: false };
    labelBox[centerId] = { x: pos[centerId].x - d.w / 2, y: top, w: d.w, h: d.h, dir: -1 };
  }
  // Peripheral band: unconnected / contextual nodes on outer rings — always
  // beyond the connected network, never mixed into it (REQ 14).
  for (let i = 0; i < isoList.length; i += GRAPH_ISO_PER_RING) {
    const chunk = isoList.slice(i, i + GRAPH_ISO_PER_RING);
    if (!chunk.length) continue;
    const circ = chunk.reduce((acc, nd) => acc + slotW(nd) + GRAPH_RING_GAP, 0);
    R = Math.max(R + GRAPH_RING_STEP, circ / (2 * Math.PI));
    placeRing(chunk, R, -1);
  }

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const span = (x, y) => {
    if (x < minX) minX = x;
    if (x > maxX) maxX = x;
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
  };
  list.forEach((n) => {
    const p = pos[n.id];
    if (!p) return;
    const r = n.id === centerId ? GRAPH_CASE_R : GRAPH_NODE_R;
    span(p.x - r, p.y - r); span(p.x + r, p.y + r);
    const lb = labelBox[n.id];
    if (lb) { span(lb.x, lb.y); span(lb.x + lb.w, lb.y + lb.h); }
    const bY = lb ? (lb.dir > 0 ? lb.y + lb.h + 5 : lb.y - 17) : p.y + r + 8;
    span(p.x - 20, bY); span(p.x + 20, bY + 12);
  });
  visibleEdges.forEach((e) => {
    const p1 = pos[e.source], p2 = pos[e.target];
    if (p1 && p2) span((p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
  });
  if (!isFinite(minX)) { minX = 0; minY = 0; maxX = 10; maxY = 10; }
  return {
    pos,
    dims,
    labelBox,
    labelMeta,
    layers: orderRings,
    layerOf,
    isoIds: new Set(isoList.map((n) => n.id)),
    bounds: { minX, minY, maxX, maxY },
  };
}
</script>

<script>
"use strict";
/* ============================================================
   1. CENTRALIZED API CLIENT
   ============================================================ */
const API = ""; // same-origin — backend serves this page

class AppError extends Error {
  constructor(message, status, technical) { super(message); this.status = status; this.technical = technical || null; }
}

async function api(path, options = {}) {
  let res;
  try {
    res = await fetch(API + path, options);
  } catch (e) {
    throw new AppError("Unable to reach the server. Check that the backend is running and try again.", 0, String(e));
  }
  let data = null;
  try { data = await res.json(); } catch (e) { /* non-JSON body */ }
  if (!res.ok) {
    const detail = data && (data.detail || data.message) ? String(data.detail || data.message) : null;
    let message;
    if (res.status >= 500) message = "The server encountered an error while processing this request. Please try again.";
    else if (detail) message = detail;
    else message = "Request failed (" + res.status + ").";
    throw new AppError(message, res.status, detail);
  }
  return data;
}

const apiGet = (p) => api(p);
function apiJSON(method, path, body) {
  return api(path, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
}
function qs(params) {
  const u = new URLSearchParams();
  for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== null && v !== "") u.set(k, v);
  const s = u.toString();
  return s ? "?" + s : "";
}

/* ============================================================
   2. HELPERS
   ============================================================ */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function fmtDate(d) { return d ? String(d).slice(0, 10) : "—"; }
function fmtDT(d) { if (!d) return "—"; const s = String(d).replace("T", " ").slice(0, 16); return s; }
function fmtSize(n) { if (n == null) return "—"; if (n < 1024) return n + " B"; if (n < 1048576) return (n / 1024).toFixed(1) + " KB"; return (n / 1048576).toFixed(1) + " MB"; }
function typeBadge(t) { return `<span class="badge type">${esc(t || "OTHER")}</span>`; }
function statusBadge(s) { return `<span class="badge ${esc(s || "")}">${esc(s || "—")}</span>`; }
function sigBadge(s) { return `<span class="badge ${esc(s || "")}">${esc(s || "—")}</span>`; }

function toast(message, kind) {

/* ============================================================
   3. ROUTER (hash-based)
   ============================================================ */
const ROUTES = [];
function addRoute(pattern, handler) { ROUTES.push({ pattern, handler }); }

function matchRoute(hash) {
  const path = (hash || "#/dashboard").replace(/^#/, "");
  for (const r of ROUTES) {
    const m = path.match(r.pattern);
    if (m) return { handler: r.handler, params: (m.groups || {}) };
  }
  return { handler: routeNotFound, params: {} };
}

function navigate(hash) { if (location.hash !== hash) location.hash = hash; else renderRoute(); }

function renderRoute() {
  const { handler, params } = matchRoute(location.hash);
  const content = document.getElementById("content");
  content.innerHTML = loadingState();
  setActiveNav(location.hash);
  handler(content, params).catch((err) => {
    content.innerHTML = errorState(err, "renderRoute()");
    if (err && err.technical) console.error(err.technical);
  });
}

function setActiveNav(hash) {
  document.querySelectorAll("#sideNav .nav-item").forEach((b) => {
    const href = b.dataset.href;
    b.classList.toggle("active", hash === href || (href !== "#/dashboard" && hash.startsWith(href)));
  });
}

function routeNotFound(container) {
  container.innerHTML = pageHead("Not found", "The requested view does not exist") + emptyState("🗂", "No such view.", `<button class="btn primary sm" onclick="navigate('#/dashboard')">Go to Dashboard</button>`);
}

/* ============================================================
   6. GLOBAL SEARCH
   ============================================================ */
const SEARCH_CATEGORIES = { PEOPLE: "People", CASES: "Cases", ORGANIZATIONS: "Organizations", EVENTS: "Events", LOCATIONS: "Locations", DOCUMENTS: "Documents" };

let searchTimer = null, searchIdx = -1, searchResults = [];
// Guards the trigger's focus listener so the programmatic refocus inside
// closeSearchOverlay() cannot immediately re-open the overlay — which used
// to leave the dimmed backdrop visible on top of the navigated page.
let searchClosing = false;
function openSearchOverlay() {
  if (document.getElementById("searchOverlay").classList.contains("open")) return;
  document.getElementById("searchOverlay").classList.add("open");
  const inp = document.getElementById("overlaySearchInput");
  inp.value = document.getElementById("globalSearchInput").value;
  inp.focus();
  runOverlaySearch();
}
function closeSearchOverlay() {
  // Remove the overlay first, then hand focus back to the search trigger.
  // The trigger's focus event is fired synchronously by .focus(), so the
  // searchClosing guard is still active while it runs — the overlay stays
  // closed after any close path (result click, Enter, Escape, backdrop).
  document.getElementById("searchOverlay").classList.remove("open");
  searchClosing = true;
  document.getElementById("globalSearchInput").focus();
  searchClosing = false;
}
function clearOverlaySearch() {
  document.getElementById("overlaySearchInput").value = "";
  searchResults = [];
  document.getElementById("overlayResults").innerHTML = "";
}
function searchRowsHTML(rows) {
  if (!rows.length) return `<div class="sr empty">No results found.</div>`;
  const byCat = {};
  for (const r of rows) (byCat[r.category] = byCat[r.category] || []).push(r);
  const order = Object.keys(SEARCH_CATEGORIES).filter((c) => byCat[c]);
  return order.map((c) =>
    `<div class="search-group-title">${SEARCH_CATEGORIES[c]}</div>` +
    byCat[c].map((r, i) => {
      const gi = searchResults.indexOf(r);
      return `<button class="sr ${gi === searchIdx ? "active" : ""}" onclick="openSearchResult(${gi})">
        <div><div class="name">${esc(r.name)}</div><div class="sub">${esc(r.sub)}</div></div>
        ${r.badge ? `<span class="badge ${esc(r.badgeCls || "neutral")}">${esc(r.badge)}</span>` : ""}
      </button>`;
    }).join("")
  ).join("");
}
async function runOverlaySearch() {
  const q = document.getElementById("overlaySearchInput").value.trim();
  const box = document.getElementById("overlayResults");
  if (!q) { searchResults = []; box.innerHTML = `<div class="sr empty">Type at least one character to search the trusted index.</div>`; return; }
  box.innerHTML = `<div class="sr empty"><span class="spinner"></span>Searching…</div>`;
  try {
    const data = await apiGet("/search" + qs({ q, limit: 25 }));
    const rows = [];
    const push = (category, id, name, sub, badge, badgeCls, href) => {
      if (name) rows.push({ category, id, name, sub: sub || "", badge, badgeCls, href });
    };
    // /search returns entities (all) plus derived people/organizations/locations
    // subsets — use the subsets so every entity appears in exactly one category.
    const seenIds = new Set();
    const pushOnce = (category, e, sub) => {
      if (!e || !e.canonical_name || seenIds.has(e.entity_id)) return;
      seenIds.add(e.entity_id);
      push(category, e.entity_id, e.canonical_name, sub, "trusted", "trusted", "#/entities/" + e.entity_id);
    };
    for (const e of data.people || []) pushOnce("PEOPLE", e, "PERSON");
    for (const o of data.organizations || []) pushOnce("ORGANIZATIONS", o, o.entity_type || "ORGANIZATION");
    for (const l of data.locations || []) pushOnce("LOCATIONS", l, "LOCATION");
    for (const e of data.entities || []) pushOnce("PEOPLE", e, e.entity_type || "ENTITY");
    for (const c of data.cases || []) push("CASES", c.case_id, c.case_name || c.official_case_number || "(case)", c.official_case_number ? c.official_case_number : c.status || "", "case", "neutral", "#/cases/" + c.case_id);
    for (const e of data.events || []) push("EVENTS", e.event_id, e.title, (e.event_type || "") + (e.date_precision ? " · " + e.date_precision : ""), "event", "neutral", "#/events/" + e.event_id);
    for (const d of data.documents || []) push("DOCUMENTS", d.document_id, d.filename, "document · " + d.processing_status, d.processing_status, "neutral", "#/data");
    searchResults = rows;
    searchIdx = -1;
    box.innerHTML = searchRowsHTML(rows);
  } catch (err) {
    box.innerHTML = `<div class="sr empty">${esc(err.message)}</div>`;
  }
}
function openSearchResult(i) {
  const r = searchResults[i];
  if (!r) return;
  closeSearchOverlay();
  navigate(r.href || "#/dashboard");
}
function overlayKeydown(e) {
  if (e.key === "Escape") { e.preventDefault(); closeSearchOverlay(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!searchResults.length) return;
    searchIdx = e.key === "ArrowDown" ? (searchIdx + 1) % searchResults.length : (searchIdx - 1 + searchResults.length) % searchResults.length;
    document.getElementById("overlayResults").innerHTML = searchRowsHTML(searchResults);
    return;
  }
  if (e.key === "Enter") { e.preventDefault(); if (searchIdx >= 0) openSearchResult(searchIdx); else if (searchResults.length) openSearchResult(0); }
}
function setupSearch() {
  const trig = document.getElementById("globalSearchInput");
  trig.addEventListener("focus", () => { if (!searchClosing) openSearchOverlay(); });
  trig.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); openSearchOverlay(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "SELECT") {
      e.preventDefault(); openSearchOverlay();
    }
  });
  const inp = document.getElementById("overlaySearchInput");
  inp.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(runOverlaySearch, 250); });
  inp.addEventListener("keydown", overlayKeydown);
  document.getElementById("overlayClear").addEventListener("click", clearOverlaySearch);
  document.getElementById("searchOverlay").addEventListener("click", (e) => { if (e.target.id === "searchOverlay") closeSearchOverlay(); });
  document.getElementById("changesBell").addEventListener("click", () => navigate("#/changes"));
}

function candDescribe(c) {
  const d = c.proposed_data || {};
  switch (c.candidate_type) {
    case "ENTITY": case "LOCATION":
      return { name: d.name, meta: "Type: " + (d.entity_type || c.candidate_type) + (d.parent_location ? " · Parent: " + d.parent_location : "") + (d.aliases && d.aliases.length ? " · Aliases: " + d.aliases.join(", ") : "") };
    case "EVENT":
      return { name: d.title, meta: "Type: " + d.event_type + (d.start_date ? " · Date: " + d.start_date + " (" + d.date_precision + ")" : " · Date: unknown") + (d.location_name ? " · " + d.location_name : "") };
    case "RELATIONSHIP":
      return { name: d.source_name + " —" + d.relationship_type + "→ " + d.target_name, meta: "Classification: " + (d.classification || "DIRECT") };
    case "FACT":
      return { name: d.subject_name + " —" + d.predicate + "→ " + (d.object_name || "(case)"), meta: "Object type: " + (d.object_type || "CASE") };
    case "CASE_MATCH":
      return { name: d.case_name || d.case_number || "(case)", meta: "Action: " + d.action + (d.case_number ? " · Number: " + d.case_number : "") + (d.jurisdiction ? " · Jurisdiction: " + d.jurisdiction : "") };
    case "CLAIM":
      return { name: "Claim (" + (d.claim_status || "UNKNOWN") + ")", meta: "Subject: " + (d.subject_name || "—") };
    default:
      return { name: c.candidate_type, meta: JSON.stringify(d) };
  }
}
function candEvidence(c) {
  const refs = (c.evidence_refs && c.evidence_refs.length ? c.evidence_refs : (c.evidence ? [c.evidence] : []));
  return refs.length ? refs.map((ev, i) => `<div class="evidence">${refs.length > 1 ? "<b>Evidence " + (i + 1) + ":</b> " : ""}“${esc(ev.exact_text)}”</div>`).join("") : "";
}
function candNote(c) {
  return c.confidence_meaning || "Confidence represents how strongly the system supports this extraction or match based on deterministic rules and available evidence. It is not a probability of guilt.";
}
function candCard(c, opts = {}) {
  const { name, meta } = candDescribe(c);
  const cls = c.status === "CONFIRMED" ? "trusted" : c.status === "REJECTED" ? "rejected" : "";
  const editable = c.status === "PENDING" || c.status === "EDITED";
  return `<div class="cand ${cls}">
    <div class="head">
      <span class="badge ${esc(c.status)}">${esc(c.status)}</span>
      <span class="type">${esc(c.candidate_type)}</span>
      <span class="name">${esc(name)}</span>
      ${c.confidence != null ? `<span class="pill">conf ${c.confidence}</span>` : ""}
    </div>
    <div class="meta">${esc(meta)} · reason: ${esc(c.reason)}</div>
    ${candEvidence(c)}
    <div class="actions">
      ${editable && opts.actions !== false ? `
        <button class="btn ok sm" onclick="reviewCandidate('${c.candidate_id}','confirm')">Confirm</button>
        <button class="btn bad sm" onclick="reviewCandidate('${c.candidate_id}','reject')">Reject</button>` : ""}
      <button class="btn ghost sm" onclick="toggleCandRaw('${c.candidate_id}')">Details</button>
    </div>
    <div class="raw hidden" id="candraw-${c.candidate_id}">
      <div class="confidence-note">${esc(candNote(c))}</div>

}
function toggleCandRaw(id) { document.getElementById("candraw-" + id).classList.toggle("hidden"); }
async function reviewCandidate(id, action) {
  try {
    await apiJSON("POST", `/candidates/${id}/${action}`, {
      reviewed_by: "web-investigator",
      reason: action === "confirm" ? "Confirmed via review interface" : "Rejected via review interface",
    });

    renderRoute();

/* ============================================================
   8. GRAPH RENDERER (reused from Phase 1/2 — trusted data only)
   ============================================================ */
let currentHops = 1;
// Backend filters forwarded to the trusted graph endpoints.
let graphFilters = { relationship_type: "", entity_type: "", case_id: "" };
let graphView = { s: 1, cx: 0, cy: 0 };    // camera state: scale + centre
let __userView = false;                     // true once the user zoomed/panned (disables auto-refit)
let lastGraphContainer = null;              // graph-wrap element id of the current graph
let __graphRaw = null;                      // last raw trusted graph payload (for in-graph search)
let __lastGraph = null;                     // last rendered { data, opts, containerId } (for Fit/Reset view)
let LAYER_BOUNDS = null;                    // layout bbox incl. labels (set by renderGraphSVG)

function renderGraphSVG(data, containerId, opts) {
  const el = document.getElementById(containerId);
  if (!el) return;
  __lastGraph = { data, opts: opts || {}, containerId };
  const wrap = el.closest(".graph-wrap") || el.parentElement;
  const nodes = data.nodes || [], edges = data.edges || [];
  // Camera center may differ from the case root (REQ 40) — centering is a
  // view/layout operation that never changes the trusted data.
  const center = (opts && opts.center && opts.center.id) ? opts.center : (data.center || {});
  const filterActive = !!(opts && opts.filterActive);
  const activeNodes = (opts && opts.activeNodes) || null;
  const activeEdges = (opts && opts.activeEdges) || null;
  const isMini = !!(opts && opts.isMini); // e.g. location-network graph
  const directness = !!(opts && opts.directness); // case mode: solid = touches center
  const selectable = !!(opts && opts.selectable); // case mode: click sets selection
  const selActive = !!(opts && opts.selNodes && opts.selNodes.size);
  const selNodes = selActive ? (opts.selNodes || null) : null;
  const selEdges = selActive ? (opts.selEdges || null) : null;
  const ids = new Set(nodes.map((n) => n.id));
  const visibleEdges = edges.filter((e) => ids.has(e.source) && ids.has(e.target));
  const nameById = {};
  nodes.forEach((n) => { nameById[n.id] = n.name; });
  // Deterministic RADIAL layout (REQ 2-6): the center sits at the origin;
  // BFS distance decides the ring (ring 1 = direct relationships, ring 2 =
  // one hop further…), labels sit OUTWARD on each ring, and nodes with no
  // path to the center live on dedicated outer rings. The bounding box
  // includes labels and badges so Fit-to-view never clips anything.
  const L = graphLayout({ nodes, edges: visibleEdges, centerId: center.id });
  LAYER_BOUNDS = L.bounds;
  const pos = L.pos, dims = L.dims, isoIds = L.isoIds, layerOf = L.layerOf || {};
  const labelBox = L.labelBox || {}, labelMeta = L.labelMeta || {};
  const byPair = {};
  visibleEdges.forEach((e) => { const k = e.source + "|" + e.target; (byPair[k] = byPair[k] || []).push(e); });
  // Labels of edges converging on the SAME node fan out around it (REQ
  // 12/21) instead of stacking on top of each other near the target.
  const tgtCount = {}, tgtSeen = {};
  visibleEdges.forEach((e) => { tgtCount[e.target] = (tgtCount[e.target] || 0) + 1; });
  let svg = `<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trusted knowledge graph">`;
  svg += `<defs><marker id="garrow" viewBox="0 0 10 10" refX="24" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55608a"/></marker></defs>`;
  // Two-pass edge rendering: compute each edge's path + label box, resolve
  // label-vs-label collisions (deterministic, bounded), then draw (REQ 21-25).
  const edgeGeom = new Map();
  for (const [k, group] of Object.entries(byPair)) {
    const [s, t] = k.split("|");
    const p1 = pos[s], p2 = pos[t];
    if (!p1 || !p2) continue;
    const n = group.length;
    group.forEach((e, i) => {
      const off = (i - (n - 1) / 2) * 14;
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const x1 = p1.x + nx * off, y1 = p1.y + ny * off;
      const x2 = p2.x + nx * off, y2 = p2.y + ny * off;
      // Same-ring edges (e.g. two ring-1 nodes) are gentle arcs bowed
      // OUTWARD from the center so they never run through neighbouring
      // labels; cross-ring edges stay straight and arrowed (REQ 21-26).
      // Direction is always SOURCE → TARGET.
      const sameRing = (layerOf[e.source] === layerOf[e.target]);
      let path, mx, my;
      if (sameRing) {
        const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2;
        const ml = Math.hypot(midX, midY) || 1;
        const ctrlX = midX + (midX / ml) * 52, ctrlY = midY + (midY / ml) * 52;
        path = `M ${x1} ${y1} Q ${ctrlX} ${ctrlY} ${x2} ${y2}`;
        mx = midX; my = midY;
      } else {
        path = `M ${x1} ${y1} L ${x2} ${y2}`;
        mx = (x1 + x2) / 2; my = (y1 + y2) / 2;
      }
      let lx = mx + nx * 10, ly = my + ny * 10 - 4;
      // Labels of edges converging on the same node fan out around it
      // instead of stacking near the target (REQ 12/21).
      const tIdx = tgtSeen[e.target] = (tgtSeen[e.target] || 0) + 1;
      const tOff = (tIdx - (tgtCount[e.target] - 1) / 2) * 18;
      lx += nx * tOff; ly += ny * tOff;
      // Nudge along the edge until the label clears every node-label box
      // (REQ 12/21) — each label stays attached to its own edge.
      // Half-extents slightly above the rendered 12px glyph width so the
      // collision pass separates labels with a safety margin but converges
      // (over-wide estimates make the cluster jostle instead of settling).
      const ew = Math.max(26, String(e.relationship_type || "").length * 4.2);
      const eh = 11;
      const dirx = dx / len, diry = dy / len;
      for (let step = 0; step < 5; step++) {
        let hit = false;
        for (const n of nodes) {
          const pn = pos[n.id];
          if (!pn) continue;
          const lbn = labelBox[n.id];
          if (lbn && lx + ew > lbn.x && lx - ew < lbn.x + lbn.w && ly + eh > lbn.y && ly - eh < lbn.y + lbn.h) { hit = true; break; }
        }
        if (!hit) break;
        lx += dirx * 18; ly += diry * 18;
      }
      edgeGeom.set(e.id, { path, lx, ly, w: ew, h: eh, nx, ny, dirx, diry });
    });
  }
  // Combined label collision resolution (bounded, deterministic): edge
  // labels are pushed apart from each other perpendicular to their edges
  // AND nudged along their own edges until clear of node labels (REQ 12/21)
  // — resolution can never shove a label back onto a node label.
  const geoms = [...edgeGeom.values()];
  for (let iter = 0; iter < 12; iter++) {
    let moved = false;
    for (let i = 0; i < geoms.length; i++) for (let j = i + 1; j < geoms.length; j++) {

/* ---------- graph camera: zoom / pan / fit (REQ 17-19, 31-37) ---------- */
// The svg always fills its panel; the camera (viewBox) chooses what is
// visible. scale 1 = whole graph fits; the readable default never renders
// below MIN_READ, so panning is the escape hatch for large graphs — never
// microscopic text (REQ 7/8). No CSS transforms, no scrollbars (REQ 32-33).
function applyGraphTransform(containerId) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;
  const svg = wrap.querySelector("svg");
  if (!svg || !graphView) return;
  const s = graphView.s || 1;
  const wrapW = wrap.clientWidth || 600, wrapH = wrap.clientHeight || 400;
  const vbW = wrapW / s, vbH = wrapH / s;
  svg.setAttribute("viewBox", `${(graphView.cx - vbW / 2).toFixed(2)} ${(graphView.cy - vbH / 2).toFixed(2)} ${vbW.toFixed(2)} ${vbH.toFixed(2)}`);
}
function graphZoom(dir) {
  __userView = true;
  graphView.s = Math.min(4, Math.max(0.25, graphView.s * (dir > 0 ? 1.25 : 1 / 1.25)));
  applyGraphTransform(lastGraphContainer);
}
// Fit-to-view (REQ 17/37): show the WHOLE graph — every node and every
// label — inside the panel at the readable minimum scale (never shrink
// below it). forceFit keeps the camera from re-defaulting.
function graphFit() {

function graphZoomReset() {

}
// Reset view (REQ 38): restore the default CASE-centered view, zoom and

function graphResetView() {

    window.__netCenter = { id: window.__netCaseData.center.id, name: window.__netCaseData.center.name, type: "CASE", kind: "case" };
    const box = document.getElementById("netCurrentCenter");

function setupGraphInteractions(containerId) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;
  applyGraphTransform(containerId);
  wrap.onwheel = (e) => {
    e.preventDefault();
    __userView = true;
    graphView.s = Math.min(4, Math.max(0.25, graphView.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
    applyGraphTransform(containerId);
  };
  if (!wrap.__dragHandlers) {
    let drag = null;
    const startDrag = (e) => {
      const t = e.target && e.target.tagName;
      // Drag on the canvas background only (svg element / wrapper); node
      // and edge elements keep their click behaviour.
      if (t === "svg" || (e.target === wrap)) {
        drag = { x: e.clientX, y: e.clientY, cx: graphView.cx, cy: graphView.cy };
        wrap.classList.add("dragging");
      }
    };
    const moveDrag = (e) => {
      if (!drag) return;
      __userView = true;
      graphView.cx = drag.cx - (e.clientX - drag.x) / graphView.s;
      graphView.cy = drag.cy - (e.clientY - drag.y) / graphView.s;

    };

}

      html += `<div class="drawer-actions">
          <button class="btn sm" onclick="navigate('#/entities/${nodeId}')">View History</button>
          <button class="btn sm" onclick="recenterGraph('entity','${nodeId}')">Expand Network</button>
          <button class="btn sm" onclick="navigate('#/entities/${nodeId}')">Open Page</button>
        </div>`;
      if (h.cases && h.cases.length) {
        html += `<div class="drawer-section-title">Cases (${h.cases.length})</div>` +
          h.cases.slice(0, 5).map((c) => `<div class="kv">${esc(c.case_name || "(case)")} <span class="muted small mono">${esc(c.official_case_number || "")}</span></div>`).join("") +
          (h.cases.length > 5 ? `<div class="muted small">…and ${h.cases.length - 5} more</div>` : "");

      if (h.events && h.events.length) {
        html += `<div class="drawer-section-title">Events (${h.events.length})</div>` +
          h.events.slice(0, 5).map((ev) => `<div class="kv">${esc(ev.title)} <span class="muted small">${esc(ev.event_type || "")}</span></div>`).join("");
      }
      html += `<div class="drawer-section-title">Relationships</div><div class="kv">${(h.relationships || []).length} confirmed relationship(s)</div>
        <div class="drawer-section-title">Sources</div>` +
        ((h.sources || []).length ? h.sources.slice(0, 5).map((s) => `<div class="kv">${esc(s.publisher || s.source_id)}</div>`).join("") : '<div class="muted small">No sources referenced.</div>');
    } else if (kind === "event") {
      const ev = await apiGet("/events/" + nodeId);
      const sm = ev.structured_metadata || {};
      const dd = await docLine(ev.document_id);
      html = `<div class="kv"><b>Type:</b> ${esc(ev.event_type)}</div>
        <div class="kv"><b>Date:</b> ${ev.start_date ? esc(ev.start_date) + (ev.end_date ? " → " + esc(ev.end_date) : "") : "Not provided"} <span class="pill">${esc(ev.date_precision || "UNKNOWN")}</span></div>
        <div class="kv"><b>Time:</b> ${ev.event_time ? esc(ev.event_time) : "Not provided"}</div>
        ${sm.status ? `<div class="kv"><b>Status:</b> ${esc(sm.status)}</div>` : ""}
        ${sm.duration ? `<div class="kv"><b>Duration:</b> ${esc(sm.duration)}</div>` : ""}
        ${sm.organization ? `<div class="kv"><b>Organization:</b> ${esc(sm.organization)}</div>` : ""}
        ${sm.drug ? `<div class="kv"><b>Drug:</b> ${esc(sm.drug)}</div>` : ""}
        ${sm.vehicle ? `<div class="kv"><b>Vehicle:</b> ${esc(sm.vehicle)}</div>` : ""}
        ${ev.description ? `<div class="kv"><b>Description:</b> ${esc(ev.description)}</div>` : ""}`;
      if (dd) html += dd;
      if (sm.evidence_snippet) html += `<div class="drawer-section-title">Evidence</div><div class="evidence">“${esc(sm.evidence_snippet)}”</div>`;
      html += `<div class="drawer-actions">
          <button class="btn sm" onclick="navigate('#/events/${nodeId}')">Open Event</button>
          <button class="btn sm" onclick="recenterGraph('event','${nodeId}')">Expand Network</button>
        </div>`;
    } else if (kind === "case") {
      const cs = await apiGet("/cases/" + nodeId);
      html = `<div class="kv"><b>Number:</b> <span class="mono">${esc(cs.official_case_number || "—")}</span></div>
        <div class="kv"><b>Type:</b> ${esc(cs.category || "—")} · <b>Status:</b> ${esc(cs.status)}</div>
        <div class="kv"><b>Jurisdiction:</b> ${esc(cs.jurisdiction || "—")}</div>
        ${cs.description ? `<div class="kv"><b>Description:</b> ${esc(cs.description)}</div>` : ""}
        <div class="drawer-actions">
          <button class="btn sm" onclick="navigate('#/cases/${nodeId}')">Open Case</button>
          <button class="btn sm" onclick="recenterGraph('case','${nodeId}')">Expand Network</button>
        </div>`;
    } else {
      html = `<div class="kv">${esc(name)}</div>`;
    }
    // Connection to the current center (REQ 12): when the selected node is
    // reachable from the graph center, show the real trusted path with its
    // relationship types — direct when one hop, indirect otherwise.
    if (window.__netSel && window.__netSel.refId === nodeId && window.__netSelPath && window.__netSelPath.path.length > 1) {
      const pth = window.__netSelPath.path;
      const egs = window.__netSelPath.edgePath || [];
      const direct = pth.length === 2;
      html = `<div class="drawer-section-title">Connection to current center</div>
        <div class="kv">${direct ? "Direct connection to the center." : "Indirect connection — reachable from the center through trusted relationships:"}</div>
        <div class="evidence">${pth.map((n2, i) => `${i ? " <span style='opacity:.6'>→</span> " : ""}<b>${esc(n2.name)}</b>`).join("")}</div>` +
        (egs.length ? `<div class="kv mt">${egs.map((e, i) => `${i ? " · " : ""}<b>${esc(e.type)}</b>`).join("")}</div>` : "") + html;
    }
    html += `<div class="drawer-section-title">Bookmark</div>
      <button class="btn ${bm ? "warn" : "ok"} sm" onclick="toggleBookmark()">${bm ? "Remove bookmark" : "Add bookmark"}</button>`;
    body.innerHTML = html;
  } catch (err) {
    body.innerHTML = `<div class="state" style="padding:14px">${esc(err.message)}</div>`;
  }
}
async function explainEdge(provKind, provId) {
  if (!provId) return;
  window.__drawerCtx = null;
  openDrawer("Why am I seeing this?", "Evidence-backed explanation for a trusted relationship");
  const body = document.getElementById("nodeDrawerBody");
  try {
    const p = await apiGet(`/graph/provenance/${provKind}/${provId}`);
    const rel = p.relationship || p.fact || null;
    let html = `<div class="drawer-section-title">Relationship</div>
      <div class="kv"><b>Type:</b> ${esc(p.relationship_type || "—")}</div>
      ${rel && rel.relationship_id ? `<div class="kv"><b>Relationship id:</b> <span class="mono">${esc(rel.relationship_id)}</span></div>` : ""}
      <div class="kv"><b>Source:</b> ${esc(p.source_name || "—")}${p.source_type ? ` <span class="pill">${esc(p.source_type)}</span>` : ""}</div>
      <div class="kv"><b>Target:</b> ${esc(p.target_name || "—")}${p.target_type ? ` <span class="pill">${esc(p.target_type)}</span>` : ""}</div>
      ${rel ? `<div class="kv"><b>Status:</b> ${esc(rel.status || "—")}</div>` : ""}
      <div class="kv"><b>Classification:</b> ${esc(p.classification || "—")}</div>`;
    // Direct vs indirect relative to the graph center (REQ 13) — computed
    // from the live case graph, never fabricated.
    if (window.__netCaseData && window.__netCenter) {
      const cid = window.__netCenter.id;
      const rel2 = (window.__netCaseData.edges || []).find((e) => e.relationship_id === provId || e.fact_id === provId || e.event_id === provId);
      if (rel2) {
        const touch = rel2.source === cid || rel2.target === cid;
        html += `<div class="kv"><b>Relative to center:</b> ${touch ? "Direct — connected to " + esc(window.__netCenter.name) : "Indirect — does not touch the center directly"}</div>`;
      }
    }
    if (p.case) html += `<div class="drawer-section-title">Case</div><div class="kv">${esc(p.case.official_case_number || p.case.case_name || "—")}</div>`;
    if (p.event) html += `<div class="drawer-section-title">Event</div><div class="kv">${esc(p.event.title || "—")}${p.event.date_precision ? ` <span class="pill">${esc(p.event.date_precision)}</span>` : ""}${p.event.start_date ? " · " + esc(p.event.start_date) : ""}</div>`;
    if (rel && rel.confidence != null) html += `<div class="drawer-section-title">Confidence</div><div class="kv">${esc(String(rel.confidence))} — extraction/matching confidence, not a probability of guilt.</div>`;
    if (p.source) html += `<div class="drawer-section-title">Source</div>
      <div class="kv"><b>Publisher:</b> ${esc(p.source.publisher || "—")}</div>
      <div class="kv"><b>Agency:</b> ${esc(p.source.agency || "—")}</div>
      <div class="kv"><b>Type:</b> ${esc(p.source.source_type || "—")}</div>
      <div class="kv"><b>Publication date:</b> ${esc(p.source.publication_date || "—")}</div>`;
    if (p.document) html += `<div class="kv"><b>Document:</b> ${esc(p.document.filename || "—")}</div>`;
    if (p.evidence) {
      html += `<div class="drawer-section-title">Evidence</div>
        <div class="evidence">“${esc(p.evidence.exact_text || "")}”</div>
        <div class="kv">${p.evidence.page_number != null ? "<b>Page:</b> " + esc(String(p.evidence.page_number)) + " · " : ""}<b>Evidence id:</b> <span class="evidence-id">${esc(p.evidence.evidence_id)}</span></div>`;
    } else {
      html += `<div class="kv">No evidence reference stored for this edge.</div>`;
    }
    if (p.document && p.document.document_id) html += `<div class="kv"><b>Document id:</b> <span class="evidence-id">${esc(p.document.document_id)}</span></div>`;
    if (p.source && p.source.source_id) html += `<div class="kv"><b>Source id:</b> <span class="evidence-id">${esc(p.source.source_id)}</span></div>`;
    html += `<div class="drawer-actions"><button class="btn sm" onclick="navigate('#/sources')">Original document available in Sources</button></div>
      <div class="muted small">No direct document-viewer endpoint exists — the original document is preserved and browsable under Sources.</div>`;
    body.innerHTML = html;
  } catch (err) {
    body.innerHTML = `<div class="state" style="padding:14px">${esc(err.message)}</div>`;
  }
}

    apiGet("/documents" + qs({ limit: 5 })).catch((e) => ({ items: [], error: e })),
    apiGet("/workspaces").catch((e) => ({ items: [], error: e })),

        <div class="panel"><h2>Network overview</h2>
          ${stats.error ? `<div class="state" style="padding:14px">${esc(stats.error.message)}</div>` : `
          <div class="row" style="gap:16px;flex-wrap:wrap">
            <div class="kpi" style="margin:0;flex:1;min-width:130px"><div class="num">${stats.total_nodes ?? "—"}</div><div class="lab">Trusted nodes</div></div>
            <div class="kpi green" style="margin:0;flex:1;min-width:130px"><div class="num">${stats.total_edges ?? "—"}</div><div class="lab">Trusted edges</div></div>
          </div>
          <div class="row mt" style="gap:6px">${Object.entries(stats.nodes_by_type || {}).map(([t, c]) => `<span class="pill" style="border-left:3px solid ${nodeColor(t)}">${esc(t)} ${c}</span>`).join("") || '<span class="muted">No trusted nodes.</span>'}</div>
          <div class="mt"><button class="btn primary sm" onclick="navigate('#/network')">Open Network Explorer</button></div>`}

        <div class="panel"><h2>What's New</h2>

            <div id="whatsNew"></div>`}

  document.getElementById("dashSearch").addEventListener("input", (e) => {

    window.__dashSearchT = setTimeout(async () => {
      const q = e.target.value.trim();
      const box = document.getElementById("dashSearchResults");
      if (!q) { box.innerHTML = ""; return; }
      box.innerHTML = '<span class="muted small"><span class="spinner"></span></span>';

        const data = await apiGet("/search" + qs({ q, limit: 5 }));

        for (const p of data.people || []) rows.push(`<button class="sr" onclick="navigate('#/entities/${p.entity_id}')"><div><div class="name">${esc(p.canonical_name)}</div><div class="sub">PERSON</div></div></button>`);
        for (const o of data.organizations || []) rows.push(`<button class="sr" onclick="navigate('#/entities/${o.entity_id}')"><div><div class="name">${esc(o.canonical_name)}</div><div class="sub">ORGANIZATION</div></div></button>`);
        for (const c of data.cases || []) rows.push(`<button class="sr" onclick="navigate('#/cases/${c.case_id}')"><div><div class="name">${esc(c.case_name || c.official_case_number || "(case)")}</div><div class="sub">CASE</div></div></button>`);

  }

async function pageCases(container) {
  container.innerHTML = pageHead("Cases", "Trusted case records") + `<div class="panel"><div class="row">

    <button class="btn ghost sm" onclick="navigate('#/cases')">Clear</button>
  </div><div id="caseList" class="mt"></div></div>`;

  async function load() {
    const q = document.getElementById("caseQ").value.trim();
    const box = document.getElementById("caseList");
    box.innerHTML = loadingState();
    try {
      const data = await apiGet("/cases" + qs({ q, limit: 200 }));
      const items = data.items || [];
      if (!items.length) {
        box.innerHTML = emptyState("◈", "No cases yet.", `<button class="btn primary sm" onclick="navigate('#/data')">Upload a document to begin</button>`);
        return;
      }
      box.innerHTML = `<div class="muted small mb">${data.total} case(s) · click a row to open</div>
      <div style="overflow-x:auto"><table class="list">
        <tr><th>Case number</th><th>Name</th><th>Category</th><th>Jurisdiction</th><th>Start</th><th>End</th><th>Status</th></tr>
        ${items.map((c) => `<tr class="clickable" onclick="navigate('#/cases/${c.case_id}')">
          <td class="mono">${esc(c.official_case_number || "—")}</td>
          <td>${esc(c.case_name || "—")}</td>
          <td>${esc(c.category || "—")}</td>
          <td>${esc(c.jurisdiction || "—")}</td>
          <td>${fmtDate(c.start_date)}</td><td>${fmtDate(c.end_date)}</td>
          <td>${statusBadge(c.status)}</td></tr>`).join("")}
      </table></div>`;
    } catch (err) { box.innerHTML = errorState(err, "renderRoute()"); }
  }
  document.getElementById("caseSearchBtn").addEventListener("click", load);
  document.getElementById("caseQ").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
  load();
}

  container.innerHTML = pageHead("Case", caseRow.official_case_number || caseRow.case_id,
    statusBadge(caseRow.status)) +
  `<div class="detail-header"><div>

  </div>
  ${caseRow.description ? `<div class="kv mt"><b>Description:</b> ${esc(caseRow.description)}</div>` : ""}</div>
  <div class="kpis">
    <div class="kpi"><div class="num">${graph ? sum("PERSON") : "—"}</div><div class="lab">People</div></div>
    <div class="kpi green"><div class="num">${graph ? sum("ORGANIZATION") + sum("AGENCY") : "—"}</div><div class="lab">Organizations</div></div>

async function loadCaseTab(tab, caseId, graph) {
  const body = document.getElementById("caseTabBody");
  if (tab === "cOverview") {
    const nodes = (graph && graph.nodes) || [];
    const people = nodes.filter((n) => n.type === "PERSON" || n.type === "AGENCY");
    const orgs = nodes.filter((n) => n.type === "ORGANIZATION");
    const events = nodes.filter((n) => n.type === "EVENT");
    const locs = nodes.filter((n) => n.type === "LOCATION");
    const renderList = (arr, kind) => arr.length ? `<div class="grid2">${arr.map((n) => `<div class="card"><div class="t">${esc(n.name)}</div><div class="s">${esc(n.type)}</div><div class="m"><button class="btn sm" onclick="navigate('#/${kind}/${esc(n.entity_id || n.event_id || n.case_id)}')">Open</button></div></div>`).join("")}</div>` : '<span class="muted small">None documented.</span>';
    // Location graph nodes carry the entity id; the entity detail view
    // exposes the Location record (location_id + entity_id) so location
    // nodes open through #/entities/{entity_id}.
    body.innerHTML =
      section("People") + renderList(people, "entities") +
      section("Organizations") + renderList(orgs, "entities") +
      section("Events") + renderList(events, "events") +
      section("Locations") + renderList(locs, "entities");
  } else if (tab === "cNetwork") {
    body.innerHTML = `<div id="graphPane">${loadingState()}</div>`;
    loadNetworkTab("case", caseId, 1, "graphPane");
  } else if (tab === "cTimeline") {
    body.innerHTML = loadingState();
    try {
      const data = await apiGet("/timeline/case/" + caseId);
      const items = data.items || [];
      body.innerHTML = items.length ? renderTimeline(items) : emptyState("≡", "No dated records for this case.");
    } catch (err) { body.innerHTML = errorState(err, "loadCaseTab('cTimeline','" + caseId + "')"); }
  } else if (tab === "cEntities") {
    const nodes = (graph && graph.nodes) || [];
    const ents = nodes.filter((n) => n.node_kind === "entity");
    body.innerHTML = ents.length ? `<div class="grid2">${ents.map((n) => `<div class="card"><div class="t">${esc(n.name)}</div><div class="s">${esc(n.type)} · ${esc(n.status)}</div><div class="m"><button class="btn sm" onclick="navigate('#/entities/${esc(n.entity_id)}')">Open</button></div></div>`).join("")}</div>` : emptyState("◎", "No entities documented for this case.");
  } else if (tab === "cEvents") {
    const nodes = (graph && graph.nodes) || [];
    const evs = nodes.filter((n) => n.node_kind === "event");
    body.innerHTML = evs.length ? evs.map((n) => `<div class="card mb"><div class="t">${esc(n.name)}</div><div class="s">${esc(n.event_type || "")}${n.date_precision ? " · " + esc(n.date_precision) : ""}${n.start_date ? " · " + esc(n.start_date) : ""}</div><div class="m"><button class="btn sm" onclick="navigate('#/events/${esc(n.event_id)}')">Open</button></div></div>`).join("") : emptyState("◷", "No events documented for this case.");
  } else if (tab === "cSources") {
    body.innerHTML = `<div class="panel">${emptyState("☰", "Data unavailable for this view.", "")}
      <div class="muted small" style="margin-top:10px">No case-to-source endpoint exists (a <code>GET /cases/{id}/sources</code> API would be required). Sources can still be explored globally and per-entity.</div>
      <div class="mt"><button class="btn sm" onclick="navigate('#/sources')">Browse all sources</button></div></div>`;
  } else if (tab === "cChanges") {
    body.innerHTML = loadingState();
    try {
      const data = await apiGet("/changes" + qs({ limit: 500 }));
      const items = (data.items || []).filter((c) => {
        const d = c.details || {};
        return d.case_id === caseId || d.id === "case:" + caseId || d.source === "case:" + caseId || d.target === "case:" + caseId;
      });
      body.innerHTML = items.length ? items.map((c) => `<div class="card mb"><div class="m"><span class="badge ${esc(c.significance)}">${esc(c.significance)}</span><span class="badge neutral">${esc(c.category)}</span><span class="muted small">${fmtDT(c.created_at)}</span></div><div class="s mt">${esc(JSON.stringify(c.details || {}))}</div></div>`).join("") : emptyState("▲", "No detected changes for this case yet.");
    } catch (err) { body.innerHTML = errorState(err, "loadCaseTab('cChanges','" + caseId + "')"); }
  }
}

const PRIO_MAX = { recency: 30, cross_cluster: 25, centrality: 20, case_relevance: 15, source_diversity: 10 };
function renderPriorityPanel(p) {
  const comps = p.breakdown || {};
  const total = Number(p.total);
  return section("Investigation priority") + `<div class="panel">
    <div class="priority-total"><span class="n">${Number.isFinite(total) ? Math.round(total) : "—"}</span><span class="of">/ 100 — analytical review-prioritization signal, not guilt or criminality</span></div>
    ${Object.entries(comps).map(([k, v]) => {
      const max = PRIO_MAX[k] || 20;
      const w = Math.min(100, Math.max(0, ((v && v.score) || 0) / max * 100));
      return `<div class="priority-row"><span class="p-label">${esc(k.replace(/_/g, " "))}</span><div class="priority-bar"><div style="width:${w}%"></div></div><span class="p-val">${v ? (v.score ?? "—") : "—"}</span></div>`;
    }).join("")}
    <div class="confidence-note">${esc(p.disclaimer || "")}</div>
  </div>`;
}

  function nodeStatusMatch(n, filter) {

    const role = String(n.role || "").toUpperCase();

    for (const n of data.nodes) {
      let ok = true;
      if (f.entityType && n.type !== f.entityType) ok = false;
      if (f.status && !nodeStatusMatch(n, f.status)) ok = false;
      if (f.search) {
        const q = f.search.toLowerCase();
        if (!String(n.name || "").toLowerCase().includes(q) && !String(n.role || "").toLowerCase().includes(q)) ok = false;
