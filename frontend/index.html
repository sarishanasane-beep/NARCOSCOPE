<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NARCOSCOPE — Investigation Workstation</title>
<style>
/* ============================================================
   NARCOSCOPE design system — professional investigation UI
   ============================================================ */
:root{
  --bg:#0b0e17; --bg2:#0e1220; --panel:#131827; --panel2:#171d2f; --panel3:#1b2236;
  --line:#232b44; --line2:#2e3857;
  --text:#dbe2f4; --text2:#aab4d6; --muted:#7c86a8;
  --accent:#5b8cff; --accent2:#7aa2ff; --accent-dim:rgba(91,140,255,.12);
  --ok:#3ecf8e; --warn:#f0a63c; --bad:#ef5b5b;
  --cand:#e0a63c; --trusted:#3ecf8e; --rejected:#8a5560;
  --node-person:#5b8cff; --node-org:#3ecf8e; --node-loc:#35c2c8;
  --node-event:#b07cff; --node-case:#f0a63c; --node-other:#8a93b8;
  --radius:10px; --radius-sm:7px;
  --sidebar-w:236px; --topbar-h:56px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Inter",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--font)}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:.2px}
::selection{background:rgba(91,140,255,.3)}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .18s ease;flex-shrink:0;z-index:40}
#sidebar.collapsed{width:64px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{height:var(--topbar-h);background:rgba(14,18,32,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:30}
#content{flex:1;padding:20px 22px 60px;max-width:1500px;width:100%}

/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8a5bff);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;letter-spacing:1px;flex-shrink:0}
.brand .name{font-size:14px;font-weight:750;letter-spacing:3px;white-space:nowrap}
.brand .name small{display:block;font-size:9px;color:var(--muted);letter-spacing:1.5px;font-weight:600}
.side-collapse{display:flex;align-items:center;justify-content:center;padding:8px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:16px}
nav.side{padding:10px 8px;overflow-y:auto;flex:1}
nav.side .sec{font-size:10px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;padding:14px 10px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:none;background:transparent;color:var(--text2);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:600;text-align:left;margin:1px 0;white-space:nowrap;transition:background .12s,color .12s}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent2)}
.nav-item .ico{width:18px;text-align:center;font-size:14px;flex-shrink:0}
.nav-item .lbl{overflow:hidden;text-overflow:ellipsis}
#sidebar.collapsed .nav-item .lbl,#sidebar.collapsed .sec,#sidebar.collapsed .brand .name,#sidebar.collapsed .brand small{display:none}
#sidebar.collapsed .nav-item{justify-content:center;padding:10px}
#sidebar.collapsed .brand{justify-content:center;padding:12px 8px}

/* ---------- topbar ---------- */
.search-trigger{flex:1;max-width:520px;position:relative}
.search-trigger input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 34px 8px 34px;font-size:13px;outline:none}
.search-trigger input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search-trigger .s-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.search-trigger .s-kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;font-family:var(--mono)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.top-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--text2);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer}
.top-btn:hover{border-color:var(--line2);color:var(--text)}
.top-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.workspace-pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;font-size:12px;cursor:pointer;color:var(--text2);max-width:230px}
.workspace-pill:hover{border-color:var(--line2)}
.workspace-pill .w-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px 4px 4px;font-size:12px;color:var(--text2)}
.user-chip .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#3a4a7a,#5b8cff);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}

/* ---------- panels & cards ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel h2,.panel h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:700}
.panel h3{margin-bottom:8px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:22px;letter-spacing:.4px}
.page-head .crumb{font-size:12px;color:var(--muted);margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden}
.kpi .num{font-size:26px;font-weight:750;letter-spacing:.3px}
.kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;margin-top:3px}
.kpi .num small{font-size:13px;color:var(--muted);font-weight:600}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.55}
.kpi.green::after{background:var(--ok)}
.kpi.amber::after{background:var(--warn)}
.kpi.purple::after{background:var(--node-event)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}

/* ---------- tables / lists ---------- */
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th{text-align:left;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line2);font-weight:700}
table.list td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr:hover td{background:rgba(255,255,255,.02)}
table.list tr.clickable{cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;transition:border-color .12s}
.card:hover{border-color:var(--line2)}
.card .t{font-size:14px;font-weight:650}
.card .s{font-size:12px;color:var(--muted);margin-top:3px}
.card .m{font-size:12px;color:var(--text2);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:750;letter-spacing:.6px;text-transform:uppercase;border:1px solid transparent}
.badge.PENDING,.badge.EDITED,.badge.CANDIDATE{background:rgba(240,166,60,.13);color:#f2bd6b;border-color:rgba(240,166,60,.35)}
.badge.CONFIRMED,.badge.ACTIVE,.badge.TRUSTED,.badge.PROCESSED{background:rgba(62,207,142,.13);color:#5fd9a4;border-color:rgba(62,207,142,.35)}
.badge.REJECTED{background:rgba(239,91,91,.13);color:#f08a8a;border-color:rgba(239,91,91,.35)}
.badge.MAJOR{background:rgba(239,91,91,.14);color:#f08a8a;border-color:rgba(239,91,91,.4)}
.badge.MODERATE{background:rgba(240,166,60,.14);color:#f2bd6b;border-color:rgba(240,166,60,.4)}
.badge.MINOR{background:rgba(124,134,168,.14);color:#a8b2d4;border-color:rgba(124,134,168,.4)}
.badge.neutral{background:rgba(124,134,168,.12);color:#a8b2d4;border-color:rgba(124,134,168,.3)}
.badge.type{background:rgba(91,140,255,.12);color:#8fb0ff;border-color:rgba(91,140,255,.3)}
.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--panel3);color:var(--text2);border:1px solid var(--line)}
.trust-chip{font-size:10px;font-weight:750;letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:6px}
.trust-chip.trusted{background:rgba(62,207,142,.12);color:#5fd9a4;border:1px solid rgba(62,207,142,.35)}
.trust-chip.candidate{background:rgba(240,166,60,.12);color:#f2bd6b;border:1px solid rgba(240,166,60,.35)}

/* ---------- forms ---------- */
label{display:block;font-size:11px;color:var(--muted);margin:12px 0 4px;letter-spacing:.5px;font-weight:600}
input,select,textarea{width:100%;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--line2);background:var(--bg2);color:var(--text);font-size:13px;font-family:var(--font);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
input:disabled,select:disabled{opacity:.5;cursor:not-allowed}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
textarea{min-height:70px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--line2);background:var(--panel3);color:var(--text);font-size:12.5px;font-weight:650;cursor:pointer;transition:filter .12s,background .12s,border-color .12s}
.btn:hover{filter:brightness(1.12)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:rgba(62,207,142,.15);border-color:rgba(62,207,142,.5);color:#5fd9a4}
.btn.bad{background:rgba(239,91,91,.13);border-color:rgba(239,91,91,.45);color:#f08a8a}
.btn.warn{background:rgba(240,166,60,.13);border-color:rgba(240,166,60,.45);color:#f2bd6b}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--text2)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab-btn{padding:8px 14px;font-size:12.5px;font-weight:650;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent2);border-bottom-color:var(--accent)}

/* ---------- detail ---------- */
.detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.detail-header h1{font-size:24px}
.detail-header .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.kv{font-size:12.5px;color:var(--muted);margin:3px 0}
.kv b{color:var(--text);font-weight:650}
.kv .mono{font-family:var(--mono);font-size:12px}
.section-title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:750;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}
.evidence{font-size:12.5px;font-style:italic;color:#c3cdee;border-left:3px solid var(--accent);padding:7px 11px;margin:7px 0;background:rgba(91,140,255,.05);border-radius:0 6px 6px 0}
.confidence-note{font-size:11.5px;color:var(--muted);margin:7px 0;line-height:1.5}

/* ---------- states ---------- */
.state{padding:34px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--radius);background:var(--panel);font-size:13px}
.state .ico{font-size:26px;margin-bottom:8px}
.state .act{margin-top:12px}
.skel{background:linear-gradient(90deg,var(--panel) 25%,var(--panel3) 50%,var(--panel) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:6px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spinner{width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-4px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:8px;padding:11px 14px;font-size:13px;box-shadow:var(--shadow);max-width:420px;animation:tin .2s ease}
.toast.ok{border-left-color:var(--ok)}
.toast.bad{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- search overlay ---------- */
#searchOverlay{position:fixed;inset:0;background:rgba(5,7,14,.72);backdrop-filter:blur(4px);z-index:100;display:none}
#searchOverlay.open{display:block}
.search-panel{max-width:680px;margin:70px auto 0;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.search-panel .sp-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.search-panel .sp-head input{flex:1;border:none;background:transparent;color:var(--text);font-size:15px;padding:6px 0;box-shadow:none}
.search-panel .sp-head input:focus{box-shadow:none}
.search-panel .sp-body{max-height:460px;overflow-y:auto;padding:8px}
.search-group-title{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px;font-weight:750}
.sr{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:none;background:transparent;color:var(--text);border-radius:8px;cursor:pointer;text-align:left}
.sr:hover{background:rgba(255,255,255,.04)}
.sr.active{background:var(--accent-dim)}
.sr .name{font-size:13.5px;font-weight:650}
.sr .sub{font-size:11px;color:var(--muted);margin-top:1px}
.sr .badge{margin-left:auto;flex-shrink:0}
.sr .empty{color:var(--muted);padding:14px;text-align:center;font-size:13px}
.sp-foot{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-radius:4px;padding:1px 5px;background:var(--bg2)}

/* ---------- graph ---------- */
.graph-wrap{background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:auto;padding:10px;margin:10px 0}
.graph-wrap svg{display:block;min-width:680px}
.hop-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.hop-bar button{background:var(--panel3);color:var(--text2);border:1px solid var(--line2);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:12px;font-weight:600}
.hop-bar button.active{background:rgba(91,140,255,.18);border-color:var(--accent);color:var(--accent2)}
.hop-note{font-size:11.5px;color:var(--muted)}
.prov-box{margin-top:10px;padding:12px;border:1px solid #33406b;border-radius:8px;background:var(--bg2);font-size:12.5px}
.prov-box h4{margin:0 0 8px;color:var(--warn);font-size:12px;letter-spacing:.5px}
.legend{font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:currentColor}

/* ---------- candidates ---------- */
.cand{background:var(--panel);border:1px solid rgba(240,166,60,.25);border-left:3px solid var(--cand);border-radius:var(--radius);padding:13px 15px;margin-bottom:12px}
.cand.trusted{background:var(--panel);border-color:rgba(62,207,142,.3);border-left-color:var(--trusted)}
.cand.rejected{border-color:rgba(239,91,91,.25);border-left-color:var(--rejected)}
.cand .head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cand .type{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.cand .name{font-weight:700;font-size:14.5px}
.cand .meta{font-size:12px;color:var(--muted);margin-top:5px}
.cand .actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.cand .raw{font-size:11px;color:#9aa3c6;overflow:auto;max-height:200px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:8px;font-family:var(--mono)}
.trusted-note{font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:22px;margin-left:6px}
.tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line2)}
.tl-item{position:relative;margin-bottom:14px}
.tl-item::before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl-item.event::before{background:var(--node-event)}
.tl-item.case::before{background:var(--node-case)}
.tl-item .t{font-weight:650;font-size:13.5px}
.tl-item .d{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- dropzone ---------- */
.dropzone{border:1.5px dashed var(--line2);border-radius:var(--radius);padding:34px 20px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s;background:var(--panel)}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-dim)}
.dropzone .big{font-size:30px;margin-bottom:8px}
.dropzone .main{color:var(--text2);font-size:14px;font-weight:600}

/* ---------- misc ---------- */
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.small{font-size:12px}
.mt{margin-top:14px}
.mb{margin-bottom:14px}
.hidden{display:none !important}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:13px}
.settings-row:last-child{border-bottom:none}
.settings-row .v{color:var(--text2);font-family:var(--mono);font-size:12px}
.progress{height:6px;background:var(--panel3);border-radius:4px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:var(--accent);transition:width .3s}

/* ---------- graph tools (Part 2) ---------- */
.graph-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.graph-tools .g-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:750;margin-right:4px}
.gbtn{min-width:28px;height:26px;padding:0 8px;border:1px solid var(--line2);background:var(--panel3);color:var(--text2);border-radius:6px;cursor:pointer;font-size:11.5px;font-weight:650;display:inline-flex;align-items:center;gap:5px}
.gbtn:hover{border-color:var(--accent);color:var(--text)}
.gbtn.active{background:rgba(91,140,255,.18);border-color:var(--accent);color:var(--accent2)}
.gbtn:disabled{opacity:.4;cursor:not-allowed}
.graph-wrap{position:relative;touch-action:none}
.graph-wrap.dragging{cursor:grabbing}

/* ---------- detail drawer (Part 2) ---------- */
.drawer-backdrop{position:fixed;inset:0;background:rgba(5,7,14,.55);z-index:110;display:none}

/* ---------- priority breakdown (Part 2) ---------- */

/* ---------- demo chip (Part 2) ---------- */

/* ---------- saved searches (Part 2) ---------- */

@media (max-width:1100px){#sidebar{width:64px}.nav-item .lbl,.sec,.brand .name{display:none}.nav-item{justify-content:center;padding:10px}.brand{justify-content:center;padding:12px 8px}}
@media (max-width:720px){#content{padding:14px 12px 50px}.kpis{grid-template-columns:repeat(2,1fr)}.top-btn .lbl{display:none}}

<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">N</div>
      <div class="name">NARCOSCOPE<small>INVESTIGATION WORKSTATION</small></div>
      <button class="side-collapse" id="sideCollapse" title="Collapse sidebar" aria-label="Collapse sidebar">«</button>
    </div>
    <nav class="side" id="sideNav"></nav>
  </aside>

  <div id="main">
    <header id="topbar">
      <div class="search-trigger">
        <span class="s-ico">⌕</span>
        <input id="globalSearchInput" type="text" placeholder="Search people, cases, events, organizations, locations…" autocomplete="off" aria-label="Global search">
        <span class="s-kbd">/</span>
      </div>
      <div class="top-right">
        <button class="top-btn" id="changesBell" title="Recent changes">
          <span>▲</span><span class="lbl">What's New</span>
        </button>
        <button class="workspace-pill" id="wsPill" title="Active workspace"></button>
        <div class="user-chip"><span class="av">IN</span><span>Investigator</span></div>
      </div>
    </header>
    <main id="content" role="main"></main>
  </div>
</div>

<div id="searchOverlay" role="dialog" aria-label="Global search">
  <div class="search-panel">
    <div class="sp-head">
      <span style="color:var(--muted)">⌕</span>
      <input id="overlaySearchInput" placeholder="Search people, cases, events, organizations, locations…" autocomplete="off">
      <button class="btn ghost sm" id="overlayClear">Clear</button>
    </div>
    <div class="sp-body" id="overlayResults"></div>
    <div class="sp-foot">
      <span><span class="kbd">↑↓</span> navigate</span>
      <span><span class="kbd">Enter</span> open</span>
      <span><span class="kbd">Esc</span> close</span>
      <span style="margin-left:auto">Trusted records only — pending candidates stay in the review queue</span>
    </div>
  </div>
</div>

<div class="drawer-backdrop" id="nodeDrawerBackdrop"></div>
<aside class="drawer" id="nodeDrawer" aria-label="Details drawer" aria-hidden="true">
  <div class="drawer-header">
    <div id="nodeDrawerHead"></div>
    <button class="drawer-close" id="nodeDrawerClose" aria-label="Close details" title="Close (Esc)">✕</button>
  </div>
  <div class="drawer-body" id="nodeDrawerBody"></div>
</aside>

<div class="toast-wrap" id="toastWrap"></div>

<script>
"use strict";
/* ============================================================
   1. CENTRALIZED API CLIENT
   ============================================================ */
const API = ""; // same-origin — backend serves this page

class AppError extends Error {
  constructor(message, status, technical) { super(message); this.status = status; this.technical = technical || null; }
}

async function api(path, options = {}) {
  let res;
  try {
    res = await fetch(API + path, options);
  } catch (e) {
    throw new AppError("Unable to reach the server. Check that the backend is running and try again.", 0, String(e));
  }
  let data = null;
  try { data = await res.json(); } catch (e) { /* non-JSON body */ }
  if (!res.ok) {
    const detail = data && (data.detail || data.message) ? String(data.detail || data.message) : null;
    let message;
    if (res.status >= 500) message = "The server encountered an error while processing this request. Please try again.";
    else if (detail) message = detail;
    else message = "Request failed (" + res.status + ").";
    throw new AppError(message, res.status, detail);
  }
  return data;
}

const apiGet = (p) => api(p);
function apiJSON(method, path, body) {
  return api(path, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
}
function qs(params) {
  const u = new URLSearchParams();
  for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== null && v !== "") u.set(k, v);
  const s = u.toString();
  return s ? "?" + s : "";
}

/* ============================================================
   2. HELPERS
   ============================================================ */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function fmtDate(d) { return d ? String(d).slice(0, 10) : "—"; }
function fmtDT(d) { if (!d) return "—"; const s = String(d).replace("T", " ").slice(0, 16); return s; }
function fmtSize(n) { if (n == null) return "—"; if (n < 1024) return n + " B"; if (n < 1048576) return (n / 1024).toFixed(1) + " KB"; return (n / 1048576).toFixed(1) + " MB"; }
function typeBadge(t) { return `<span class="badge type">${esc(t || "OTHER")}</span>`; }
function statusBadge(s) { return `<span class="badge ${esc(s || "")}">${esc(s || "—")}</span>`; }
function sigBadge(s) { return `<span class="badge ${esc(s || "")}">${esc(s || "—")}</span>`; }
const NODE_COLORS = { PERSON:"#5b8cff", ORGANIZATION:"#3ecf8e", AGENCY:"#3ecf8e", LOCATION:"#35c2c8", EVENT:"#b07cff", CASE:"#f0a63c", PROPERTY:"#8a93b8", OTHER:"#8a93b8" };
const nodeColor = (t) => NODE_COLORS[t] || NODE_COLORS.OTHER;
const trunc = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const _norm = (s) => String(s || "").toLowerCase().trim();

function toast(message, kind) {
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = message;
  document.getElementById("toastWrap").appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

function emptyState(icon, title, actionHtml) {
  return `<div class="state"><div class="ico">${icon}</div><div>${esc(title)}</div>${actionHtml ? `<div class="act">${actionHtml}</div>` : ""}</div>`;
}
function loadingState() {
  return `<div class="state"><span class="spinner"></span>Loading…</div>`;
}
function errorState(err, retry) {
  return `<div class="state"><div class="ico">⚠</div><div>${esc(err && err.message ? err.message : "Something went wrong.")}</div>` +
    (retry ? `<div class="act"><button class="btn primary sm" onclick="${retry}">Try again</button></div>` : "") + `</div>`;
}
const pageHead = (title, crumb, rightHtml) =>
  `<div class="page-head"><div><h1>${esc(title)}</h1><div class="crumb">${crumb || ""}</div></div>${rightHtml ? `<div class="row">${rightHtml}</div>` : ""}</div>`;
function section(title) { return `<div class="section-title">${esc(title)}</div>`; }

/* ============================================================
   3. ROUTER (hash-based)
   ============================================================ */
const ROUTES = [];
function addRoute(pattern, handler) { ROUTES.push({ pattern, handler }); }

function matchRoute(hash) {
  const path = (hash || "#/dashboard").replace(/^#/, "");
  for (const r of ROUTES) {
    const m = path.match(r.pattern);
    if (m) return { handler: r.handler, params: (m.groups || {}) };
  }
  return { handler: routeNotFound, params: {} };
}

function navigate(hash) { if (location.hash !== hash) location.hash = hash; else renderRoute(); }

function renderRoute() {
  const { handler, params } = matchRoute(location.hash);
  const content = document.getElementById("content");
  content.innerHTML = loadingState();
  setActiveNav(location.hash);
  handler(content, params).catch((err) => {
    content.innerHTML = errorState(err, "renderRoute()");
    if (err && err.technical) console.error(err.technical);
  });
}

function setActiveNav(hash) {
  document.querySelectorAll("#sideNav .nav-item").forEach((b) => {
    const href = b.dataset.href;
    b.classList.toggle("active", hash === href || (href !== "#/dashboard" && hash.startsWith(href)));
  });
}

function routeNotFound(container) {
  container.innerHTML = pageHead("Not found", "The requested view does not exist") + emptyState("🗂", "No such view.", `<button class="btn primary sm" onclick="navigate('#/dashboard')">Go to Dashboard</button>`);
}

/* ============================================================
   4. SIDEBAR
   ============================================================ */
const NAV = [
  { sec: "Overview" },
  { href: "#/dashboard", ico: "▦", lbl: "Dashboard" },
  { href: "#/changes",   ico: "▲", lbl: "What's New" },
  { sec: "Investigation" },
  { href: "#/cases",      ico: "◈", lbl: "Cases" },
  { href: "#/entities",   ico: "◎", lbl: "Entities" },
  { href: "#/events",     ico: "◷", lbl: "Events" },
  { href: "#/locations",  ico: "✈", lbl: "Locations" },
  { href: "#/network",    ico: "◉", lbl: "Network Explorer" },
  { href: "#/timeline",   ico: "≡", lbl: "Timeline" },
  { sec: "Work" },
  { href: "#/workspaces", ico: "▤", lbl: "Workspaces" },
  { href: "#/saved-searches", ico: "⌕", lbl: "Saved Searches" },
  { href: "#/sources",     ico: "☰", lbl: "Sources" },
  { href: "#/data",        ico: "⇪", lbl: "Data Management" },
  { href: "#/settings",    ico: "⚙", lbl: "Settings" },
];

function buildSidebar() {
  const nav = document.getElementById("sideNav");
  nav.innerHTML = NAV.map((n) =>
    n.sec ? `<div class="sec">${esc(n.sec)}</div>`
    : `<button class="nav-item" data-href="${n.href}" onclick="navigate('${n.href}')">
         <span class="ico">${n.ico}</span><span class="lbl">${esc(n.lbl)}</span></button>`
  ).join("");
  document.getElementById("sideCollapse").addEventListener("click", () => {
    const sb = document.getElementById("sidebar");
    sb.classList.toggle("collapsed");
  });
}

/* ============================================================
   5. TOPBAR: workspace pill
   ============================================================ */
let activeWorkspaceId = localStorage.getItem("narc.activeWorkspace") || null;

async function refreshWorkspacePill() {
  const pill = document.getElementById("wsPill");
  try {
    const list = await apiGet("/workspaces");
    const items = list.items || [];
    let ws = items.find((w) => w.workspace_id === activeWorkspaceId) || items[0];
    if (ws) {
      activeWorkspaceId = ws.workspace_id;
      localStorage.setItem("narc.activeWorkspace", activeWorkspaceId);
      pill.innerHTML = `<span>▤</span><span class="w-name">${esc(ws.name)}</span>`;
      pill.title = "Active workspace: " + ws.name + " — click to open";
      pill.onclick = () => navigate("#/workspaces/" + ws.workspace_id);
    } else {
      pill.innerHTML = `<span>▤</span><span class="w-name">No active workspace</span>`;
      pill.onclick = () => navigate("#/workspaces");
    }
  } catch (e) {
    pill.innerHTML = `<span>▤</span><span class="w-name">Workspaces unavailable</span>`;
  }
}

/* ============================================================
   6. GLOBAL SEARCH
   ============================================================ */
const SEARCH_CATEGORIES = { PEOPLE: "People", CASES: "Cases", ORGANIZATIONS: "Organizations", EVENTS: "Events", LOCATIONS: "Locations", DOCUMENTS: "Documents" };

let searchTimer = null, searchIdx = -1, searchResults = [];
// Guards the trigger's focus listener so the programmatic refocus inside
// closeSearchOverlay() cannot immediately re-open the overlay — which used
// to leave the dimmed backdrop visible on top of the navigated page.
let searchClosing = false;
function openSearchOverlay() {
  if (document.getElementById("searchOverlay").classList.contains("open")) return;
  document.getElementById("searchOverlay").classList.add("open");
  const inp = document.getElementById("overlaySearchInput");
  inp.value = document.getElementById("globalSearchInput").value;
  inp.focus();
  runOverlaySearch();
}
function closeSearchOverlay() {
  // Remove the overlay first, then hand focus back to the search trigger.
  // The trigger's focus event is fired synchronously by .focus(), so the
  // searchClosing guard is still active while it runs — the overlay stays
  // closed after any close path (result click, Enter, Escape, backdrop).
  document.getElementById("searchOverlay").classList.remove("open");
  searchClosing = true;
  document.getElementById("globalSearchInput").focus();
  searchClosing = false;
}
function clearOverlaySearch() {
  document.getElementById("overlaySearchInput").value = "";
  searchResults = [];
  document.getElementById("overlayResults").innerHTML = "";
}
function searchRowsHTML(rows) {
  if (!rows.length) return `<div class="sr empty">No results found.</div>`;
  const byCat = {};
  for (const r of rows) (byCat[r.category] = byCat[r.category] || []).push(r);
  const order = Object.keys(SEARCH_CATEGORIES).filter((c) => byCat[c]);
  return order.map((c) =>
    `<div class="search-group-title">${SEARCH_CATEGORIES[c]}</div>` +
    byCat[c].map((r, i) => {
      const gi = searchResults.indexOf(r);
      return `<button class="sr ${gi === searchIdx ? "active" : ""}" onclick="openSearchResult(${gi})">
        <div><div class="name">${esc(r.name)}</div><div class="sub">${esc(r.sub)}</div></div>
        ${r.badge ? `<span class="badge ${esc(r.badgeCls || "neutral")}">${esc(r.badge)}</span>` : ""}
      </button>`;
    }).join("")
  ).join("");
}
async function runOverlaySearch() {
  const q = document.getElementById("overlaySearchInput").value.trim();
  const box = document.getElementById("overlayResults");
  if (!q) { searchResults = []; box.innerHTML = `<div class="sr empty">Type at least one character to search the trusted index.</div>`; return; }
  box.innerHTML = `<div class="sr empty"><span class="spinner"></span>Searching…</div>`;
  try {
    const data = await apiGet("/search" + qs({ q, limit: 25 }));
    const rows = [];
    const push = (category, id, name, sub, badge, badgeCls, href) => {
      if (name) rows.push({ category, id, name, sub: sub || "", badge, badgeCls, href });
    };
    // /search returns entities (all) plus derived people/organizations/locations
    // subsets — use the subsets so every entity appears in exactly one category.
    const seenIds = new Set();
    const pushOnce = (category, e, sub) => {
      if (!e || !e.canonical_name || seenIds.has(e.entity_id)) return;
      seenIds.add(e.entity_id);
      push(category, e.entity_id, e.canonical_name, sub, "trusted", "trusted", "#/entities/" + e.entity_id);
    };
    for (const e of data.people || []) pushOnce("PEOPLE", e, "PERSON");
    for (const o of data.organizations || []) pushOnce("ORGANIZATIONS", o, o.entity_type || "ORGANIZATION");
    for (const l of data.locations || []) pushOnce("LOCATIONS", l, "LOCATION");
    for (const e of data.entities || []) pushOnce("PEOPLE", e, e.entity_type || "ENTITY");
    for (const c of data.cases || []) push("CASES", c.case_id, c.case_name || c.official_case_number || "(case)", c.official_case_number ? c.official_case_number : c.status || "", "case", "neutral", "#/cases/" + c.case_id);
    for (const e of data.events || []) push("EVENTS", e.event_id, e.title, (e.event_type || "") + (e.date_precision ? " · " + e.date_precision : ""), "event", "neutral", "#/events/" + e.event_id);
    for (const d of data.documents || []) push("DOCUMENTS", d.document_id, d.filename, "document · " + d.processing_status, d.processing_status, "neutral", "#/data");
    searchResults = rows;
    searchIdx = -1;
    box.innerHTML = searchRowsHTML(rows);
  } catch (err) {
    box.innerHTML = `<div class="sr empty">${esc(err.message)}</div>`;
  }
}
function openSearchResult(i) {
  const r = searchResults[i];
  if (!r) return;
  closeSearchOverlay();
  navigate(r.href || "#/dashboard");
}
function overlayKeydown(e) {
  if (e.key === "Escape") { e.preventDefault(); closeSearchOverlay(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!searchResults.length) return;
    searchIdx = e.key === "ArrowDown" ? (searchIdx + 1) % searchResults.length : (searchIdx - 1 + searchResults.length) % searchResults.length;
    document.getElementById("overlayResults").innerHTML = searchRowsHTML(searchResults);
    return;
  }
  if (e.key === "Enter") { e.preventDefault(); if (searchIdx >= 0) openSearchResult(searchIdx); else if (searchResults.length) openSearchResult(0); }
}
function setupSearch() {
  const trig = document.getElementById("globalSearchInput");
  trig.addEventListener("focus", () => { if (!searchClosing) openSearchOverlay(); });
  trig.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); openSearchOverlay(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "SELECT") {
      e.preventDefault(); openSearchOverlay();
    }
  });
  const inp = document.getElementById("overlaySearchInput");
  inp.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(runOverlaySearch, 250); });
  inp.addEventListener("keydown", overlayKeydown);
  document.getElementById("overlayClear").addEventListener("click", clearOverlaySearch);
  document.getElementById("searchOverlay").addEventListener("click", (e) => { if (e.target.id === "searchOverlay") closeSearchOverlay(); });
  document.getElementById("changesBell").addEventListener("click", () => navigate("#/changes"));
}

/* ============================================================
   7. CANDIDATE RENDERING + REVIEW (reused, wired to real APIs)
   ============================================================ */
function candDescribe(c) {
  const d = c.proposed_data || {};
  switch (c.candidate_type) {
    case "ENTITY": case "LOCATION":
      return { name: d.name, meta: "Type: " + (d.entity_type || c.candidate_type) + (d.parent_location ? " · Parent: " + d.parent_location : "") + (d.aliases && d.aliases.length ? " · Aliases: " + d.aliases.join(", ") : "") };
    case "EVENT":
      return { name: d.title, meta: "Type: " + d.event_type + (d.start_date ? " · Date: " + d.start_date + " (" + d.date_precision + ")" : " · Date: unknown") + (d.location_name ? " · " + d.location_name : "") };
    case "RELATIONSHIP":
      return { name: d.source_name + " —" + d.relationship_type + "→ " + d.target_name, meta: "Classification: " + (d.classification || "DIRECT") };
    case "FACT":
      return { name: d.subject_name + " —" + d.predicate + "→ " + (d.object_name || "(case)"), meta: "Object type: " + (d.object_type || "CASE") };
    case "CASE_MATCH":
      return { name: d.case_name || d.case_number || "(case)", meta: "Action: " + d.action + (d.case_number ? " · Number: " + d.case_number : "") + (d.jurisdiction ? " · Jurisdiction: " + d.jurisdiction : "") };
    case "CLAIM":
      return { name: "Claim (" + (d.claim_status || "UNKNOWN") + ")", meta: "Subject: " + (d.subject_name || "—") };
    default:
      return { name: c.candidate_type, meta: JSON.stringify(d) };
  }
}
function candEvidence(c) {
  const refs = (c.evidence_refs && c.evidence_refs.length ? c.evidence_refs : (c.evidence ? [c.evidence] : []));
  return refs.length ? refs.map((ev, i) => `<div class="evidence">${refs.length > 1 ? "<b>Evidence " + (i + 1) + ":</b> " : ""}“${esc(ev.exact_text)}”</div>`).join("") : "";
}
function candNote(c) {
  return c.confidence_meaning || "Confidence represents how strongly the system supports this extraction or match based on deterministic rules and available evidence. It is not a probability of guilt.";
}
function candCard(c, opts = {}) {
  const { name, meta } = candDescribe(c);
  const cls = c.status === "CONFIRMED" ? "trusted" : c.status === "REJECTED" ? "rejected" : "";
  const editable = c.status === "PENDING" || c.status === "EDITED";
  return `<div class="cand ${cls}">
    <div class="head">
      <span class="badge ${esc(c.status)}">${esc(c.status)}</span>
      <span class="type">${esc(c.candidate_type)}</span>
      <span class="name">${esc(name)}</span>
      ${c.confidence != null ? `<span class="pill">conf ${c.confidence}</span>` : ""}
    </div>
    <div class="meta">${esc(meta)} · reason: ${esc(c.reason)}</div>
    ${candEvidence(c)}
    <div class="actions">
      ${editable && opts.actions !== false ? `

/* ============================================================
   8. GRAPH RENDERER (reused from Phase 1/2 — trusted data only)
   ============================================================ */
let currentHops = 1;
// Backend filters forwarded to the trusted graph endpoints.
let graphFilters = { relationship_type: "", entity_type: "", case_id: "" };
let graphView = { scale: 1, tx: 0, ty: 0 }; // zoom/pan state
let lastGraphContainer = null;              // graph-wrap element id of the current graph
let __graphRaw = null;                      // last raw trusted graph payload (for in-graph search)

function renderGraphSVG(data, containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const W = 900, H = 560, CX = 450, CY = 280;
  const nodes = data.nodes || [], edges = data.edges || [], center = data.center || {};
  const ids = new Set(nodes.map((n) => n.id));
  const visibleEdges = edges.filter((e) => ids.has(e.source) && ids.has(e.target));
  const neighbors = nodes.filter((n) => n.id !== center.id);
  const radius = Math.min(250, 110 + neighbors.length * 20);
  const pos = {};
  pos[center.id] = { x: CX, y: CY };
  neighbors.forEach((n, i) => {
    const angle = (2 * Math.PI * i) / Math.max(neighbors.length, 1) - Math.PI / 2;
    pos[n.id] = { x: CX + radius * Math.cos(angle), y: CY + radius * Math.sin(angle) };
  });
  const byPair = {};
  visibleEdges.forEach((e) => { const k = e.source + "|" + e.target; (byPair[k] = byPair[k] || []).push(e); });
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trusted knowledge graph">`;
  svg += `<defs><marker id="garrow" viewBox="0 0 10 10" refX="24" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55608a"/></marker></defs>`;
  for (const [k, group] of Object.entries(byPair)) {
    const [s, t] = k.split("|");
    const p1 = pos[s], p2 = pos[t];
    if (!p1 || !p2) continue;
    const n = group.length;
    group.forEach((e, i) => {
      const off = (i - (n - 1) / 2) * 14;
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const x1 = p1.x + nx * off, y1 = p1.y + ny * off;
      const x2 = p2.x + nx * off, y2 = p2.y + ny * off;
      const provId = e.relationship_id || e.fact_id || e.event_id || "";
      const provKind = e.provenance_kind || "relationship";
      // DIRECT edges are solid; DERIVED edges are dashed. Candidate edges
      // never reach the trusted graph — the backend only serves confirmed rows.
      const dashed = String(e.classification || "DIRECT").toUpperCase() === "DERIVED" ? " stroke-dasharray=\"6,4\"" : "";
      svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#55608a" stroke-width="1.5" marker-end="url(#garrow)"${dashed} style="cursor:pointer" onclick="explainEdge('${esc(provKind)}','${esc(provId)}')"/>`;
      svg += `<text x="${(x1 + x2) / 2 + nx * 8}" y="${(y1 + y2) / 2 + ny * 8 - 5}" font-size="9" fill="#8a93b8" text-anchor="middle">${esc(e.relationship_type)}</text>`;
    });
  }
  for (const n of nodes) {
    const p = pos[n.id];
    if (!p) continue;
    const isCenter = n.id === center.id;
    const r = isCenter ? 20 : 15;
    const refId = n.entity_id || n.event_id || n.case_id || "";
    svg += `<g onclick="openNodePanel('${n.node_kind}','${esc(refId)}')" style="cursor:pointer">
      <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${nodeColor(n.type)}" stroke="${isCenter ? "#ffffff" : "#0b0e17"}" stroke-width="${isCenter ? 2.5 : 1.5}"/>
      <text x="${p.x}" y="${p.y + r + 13}" font-size="10" fill="#dbe2f4" text-anchor="middle">${esc(trunc(n.name, 24))}</text>
    </g>`;
  }
  svg += "</svg>";
  el.innerHTML = svg + `<div class="legend">${Object.keys(NODE_COLORS).map((t) => `<span style="color:${NODE_COLORS[t]}">${t}</span>`).join("")}<span style="color:#55608a">——— direct</span><span style="color:#55608a">— — — derived</span></div>`;
  lastGraphContainer = containerId;
  setupGraphInteractions(containerId);
}

/* ---------- graph zoom / pan / interactions ---------- */
function applyGraphTransform(containerId) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;
  const svg = wrap.querySelector("svg");
  if (!svg) return;
  svg.style.transformOrigin = "0 0";
  svg.style.transform = `translate(${graphView.tx}px, ${graphView.ty}px) scale(${graphView.scale})`;
}
function graphZoom(dir) {
  graphView.scale = Math.min(3, Math.max(0.4, graphView.scale * (dir > 0 ? 1.2 : 1 / 1.2)));
  applyGraphTransform(lastGraphContainer);
}
function graphZoomReset() {
  graphView = { scale: 1, tx: 0, ty: 0 };
  applyGraphTransform(lastGraphContainer);
}
function setupGraphInteractions(containerId) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;
  graphView = { scale: 1, tx: 0, ty: 0 };
  applyGraphTransform(containerId);
  wrap.onwheel = (e) => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    graphView.scale = Math.min(3, Math.max(0.4, graphView.scale * f));
    applyGraphTransform(containerId);
  };
  let drag = null;
  const startDrag = (e) => {
    const t = e.target && e.target.tagName;
    // Drag on the canvas background only (svg element / wrapper); node and
    // edge elements keep their click behaviour.
    if (t === "svg" || (e.target === wrap)) {
      drag = { x: e.clientX - graphView.tx, y: e.clientY - graphView.ty };
      wrap.classList.add("dragging");
    }
  };
  const moveDrag = (e) => {
    if (!drag) return;
    graphView.tx = e.clientX - drag.x;
    graphView.ty = e.clientY - drag.y;
    applyGraphTransform(containerId);
  };
  const endDrag = () => { drag = null; wrap.classList.remove("dragging"); };
  wrap.addEventListener("mousedown", startDrag);
  window.addEventListener("mousemove", moveDrag);
  window.addEventListener("mouseup", endDrag);
}
function recenterGraph(nodeKind, nodeId) {
  if (!nodeId) return;
  const pane = document.getElementById("graphPane");
  if (pane && pane.querySelector(".graph-wrap")) loadNetworkTab(nodeKind, nodeId, currentHops, "graphPane");
  else navigate(nodeKind === "entity" ? "#/entities/" + nodeId : nodeKind === "event" ? "#/events/" + nodeId : "#/cases/" + nodeId);
}
function graphFilterByName(q) {
  if (!__graphRaw) return;
  const all = __graphRaw;
  const nodes = (all.nodes || []).filter((n) => _norm(n.name).includes(_norm(q)));
  renderGraphSVG({
    ...all,
    nodes,
    edges: (all.edges || []).filter((ed) => nodes.some((n) => n.id === ed.source) && nodes.some((n) => n.id === ed.target)),
  }, "graphPane-svg");
}
function graphUrlFor(kind, id, hops, extra) {
  const base = kind === "case" ? `/graph/case/${id}` : kind === "event" ? `/graph/event/${id}` : kind === "location" ? `/graph/location/${id}` : `/graph/entity/${id}`;
  const params = { hops: hops || 1, limit: 100, ...(extra || {}) };
  for (const k of ["relationship_type", "entity_type", "case_id"]) if (graphFilters[k]) params[k] = graphFilters[k];
  return base + qs(params);
}
async function loadNetworkTab(kind, id, hops, containerId, extra) {
  const pane = document.getElementById(containerId || "graphPane");
  if (!pane) return;
  pane.innerHTML = loadingState();
  currentHops = hops || 1;
  try {
    const data = await apiGet(graphUrlFor(kind, id, currentHops, extra));
    const paneId = containerId || "graphPane";
    const bar = `<div class="hop-bar">
      <button class="${currentHops === 1 ? "active" : ""}" onclick="loadNetworkTab('${kind}','${esc(id)}',1,'${paneId}',${extra ? JSON.stringify(extra) : "null"})">1-hop</button>
      <button class="${currentHops === 2 ? "active" : ""}" onclick="loadNetworkTab('${kind}','${esc(id)}',2,'${paneId}',${extra ? JSON.stringify(extra) : "null"})">2-hop</button>
      <span class="hop-note">${data.truncated ? `Graph limit reached: showing the ${data.nodes.length} most relevant of ${data.total_found} nodes.` : `${data.total_found} node(s) in view.`}</span>
    </div>

      <span class="g-label">View</span>
      <button class="gbtn" onclick="graphZoom(1)" title="Zoom in" aria-label="Zoom in">+</button>
      <button class="gbtn" onclick="graphZoom(-1)" title="Zoom out" aria-label="Zoom out">−</button>
      <button class="gbtn" onclick="graphZoomReset()" title="Reset zoom and position" aria-label="Reset zoom">⤢</button>
      <button class="gbtn" onclick="loadNetworkTab('${kind}','${esc(id)}',${currentHops === 1 ? 2 : 1},'${paneId}',${extra ? JSON.stringify(extra) : "null"})" title="${currentHops === 1 ? "Expand to 2-hop" : "Collapse to 1-hop"}">${currentHops === 1 ? "Expand" : "Collapse"}</button>
    </div>
    <div class="graph-wrap" id="${paneId}-svg"></div>
    <div class="hop-note mt">Click a node to inspect it · click a relationship edge for “Why am I seeing this?”. A 2-hop connection is never shown as a direct relationship.</div>`;
    pane.innerHTML = bar;

    renderGraphSVG(data, paneId + "-svg");
  } catch (err) {
    pane.innerHTML = errorState(err, "loadNetworkTab('" + kind + "','" + id + "'," + hops + ",'" + (containerId || "graphPane") + "')");
  }
}

          ${bookmarks.error ? `<div class="state" style="padding:14px">${esc(bookmarks.error.message)}</div>` : !(bookmarks.items || []).length ? emptyState("☆", "No bookmarks yet.", `<button class="btn primary sm" onclick="navigate('#/entities')">Browse entities</button>`) : bookmarks.items.slice(0, 8).map((b) => `<div class="ss-row">

        </div>
      </div>
    </div>`;

    : emptyState("▤", "No active workspace.", `<button class="btn primary sm" onclick="navigate('#/workspaces')">Create or select a workspace</button>`);

  document.getElementById("dashSearch").addEventListener("input", (e) => {
    clearTimeout(window.__dashSearchT);
    window.__dashSearchT = setTimeout(async () => {
      const q = e.target.value.trim();
      const box = document.getElementById("dashSearchResults");
      if (!q) { box.innerHTML = ""; return; }
      box.innerHTML = '<span class="muted small"><span class="spinner"></span></span>';
      try {
        const data = await apiGet("/search" + qs({ q, limit: 5 }));
        const rows = [];
        for (const p of data.people || []) rows.push(`<button class="sr" onclick="navigate('#/entities/${p.entity_id}')"><div><div class="name">${esc(p.canonical_name)}</div><div class="sub">PERSON</div></div></button>`);
        for (const o of data.organizations || []) rows.push(`<button class="sr" onclick="navigate('#/entities/${o.entity_id}')"><div><div class="name">${esc(o.canonical_name)}</div><div class="sub">ORGANIZATION</div></div></button>`);
        for (const c of data.cases || []) rows.push(`<button class="sr" onclick="navigate('#/cases/${c.case_id}')"><div><div class="name">${esc(c.case_name || c.official_case_number || "(case)")}</div><div class="sub">CASE</div></div></button>`);
        for (const e of data.events || []) rows.push(`<button class="sr" onclick="navigate('#/events/${e.event_id}')"><div><div class="name">${esc(e.title)}</div><div class="sub">EVENT</div></div></button>`);
        box.innerHTML = rows.join("") || '<span class="muted small">No results.</span>';
      } catch (err) { box.innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
    }, 250);
  });

  const wn = document.getElementById("whatsNew");
  if (wn) {
    const items = changes.items || [];
    wn.innerHTML = items.map((c) => {
      const name = (c.details || {}).name || (c.reference_id || "").split(":").pop() || c.category;

    }).join("");

}

async function loadCaseTab(tab, caseId, graph) {
  const body = document.getElementById("caseTabBody");
  if (tab === "cOverview") {
    const nodes = (graph && graph.nodes) || [];
    const people = nodes.filter((n) => n.type === "PERSON" || n.type === "AGENCY");
    const orgs = nodes.filter((n) => n.type === "ORGANIZATION");
    const events = nodes.filter((n) => n.type === "EVENT");
    const locs = nodes.filter((n) => n.type === "LOCATION");
    const renderList = (arr, kind) => arr.length ? `<div class="grid2">${arr.map((n) => `<div class="card"><div class="t">${esc(n.name)}</div><div class="s">${esc(n.type)}</div><div class="m"><button class="btn sm" onclick="navigate('#/${kind}/${esc(n.entity_id || n.event_id || n.case_id)}')">Open</button></div></div>`).join("")}</div>` : '<span class="muted small">None documented.</span>';
    // Location graph nodes carry the entity id; the entity detail view
    // exposes the Location record (location_id + entity_id) so location
    // nodes open through #/entities/{entity_id}.
    body.innerHTML =
      section("People") + renderList(people, "entities") +
      section("Organizations") + renderList(orgs, "entities") +
      section("Events") + renderList(events, "events") +
      section("Locations") + renderList(locs, "entities");
  } else if (tab === "cNetwork") {
    body.innerHTML = `<div id="graphPane">${loadingState()}</div>`;
    loadNetworkTab("case", caseId, 1, "graphPane");
  } else if (tab === "cTimeline") {
    body.innerHTML = loadingState();
    try {
      const data = await apiGet("/timeline/case/" + caseId);
      const items = data.items || [];
      body.innerHTML = items.length ? renderTimeline(items) : emptyState("≡", "No dated records for this case.");
    } catch (err) { body.innerHTML = errorState(err, "loadCaseTab('cTimeline','" + caseId + "')"); }
  } else if (tab === "cEntities") {
    const nodes = (graph && graph.nodes) || [];
    const ents = nodes.filter((n) => n.node_kind === "entity");
    body.innerHTML = ents.length ? `<div class="grid2">${ents.map((n) => `<div class="card"><div class="t">${esc(n.name)}</div><div class="s">${esc(n.type)} · ${esc(n.status)}</div><div class="m"><button class="btn sm" onclick="navigate('#/entities/${esc(n.entity_id)}')">Open</button></div></div>`).join("")}</div>` : emptyState("◎", "No entities documented for this case.");
  } else if (tab === "cEvents") {
    const nodes = (graph && graph.nodes) || [];
    const evs = nodes.filter((n) => n.node_kind === "event");
    body.innerHTML = evs.length ? evs.map((n) => `<div class="card mb"><div class="t">${esc(n.name)}</div><div class="s">${esc(n.event_type || "")}${n.date_precision ? " · " + esc(n.date_precision) : ""}${n.start_date ? " · " + esc(n.start_date) : ""}</div><div class="m"><button class="btn sm" onclick="navigate('#/events/${esc(n.event_id)}')">Open</button></div></div>`).join("") : emptyState("◷", "No events documented for this case.");
  } else if (tab === "cSources") {
    body.innerHTML = `<div class="panel">${emptyState("☰", "Data unavailable for this view.", "")}
      <div class="muted small" style="margin-top:10px">No case-to-source endpoint exists (a <code>GET /cases/{id}/sources</code> API would be required). Sources can still be explored globally and per-entity.</div>
      <div class="mt"><button class="btn sm" onclick="navigate('#/sources')">Browse all sources</button></div></div>`;
  } else if (tab === "cChanges") {
    body.innerHTML = loadingState();
    try {
      const data = await apiGet("/changes" + qs({ limit: 500 }));
      const items = (data.items || []).filter((c) => {
        const d = c.details || {};
        return d.case_id === caseId || d.id === "case:" + caseId || d.source === "case:" + caseId || d.target === "case:" + caseId;
      });
      body.innerHTML = items.length ? items.map((c) => `<div class="card mb"><div class="m"><span class="badge ${esc(c.significance)}">${esc(c.significance)}</span><span class="badge neutral">${esc(c.category)}</span><span class="muted small">${fmtDT(c.created_at)}</span></div><div class="s mt">${esc(JSON.stringify(c.details || {}))}</div></div>`).join("") : emptyState("▲", "No detected changes for this case yet.");
    } catch (err) { body.innerHTML = errorState(err, "loadCaseTab('cChanges','" + caseId + "')"); }
  }
}

async function loadEntityTab(tab, id, entity, h, cross, graph) {
  const body = document.getElementById("entTabBody");
  const linkList = (arr, href) => (arr || []).length ? `<div class="grid2">${arr.map((x) => `<div class="card"><div class="t">${esc(x.canonical_name || x.title || x.case_name || x.case_number || x.publisher || "")}</div><div class="s">${esc(x.entity_type || x.event_type || x.source_type || "")}</div><div class="m"><button class="btn sm" onclick="navigate('${href.replace("{id}", x.entity_id || x.case_id || x.event_id || x.source_id)}')">Open</button></div></div>`).join("")}</div>` : '<span class="muted small">None documented.</span>';
  if (tab === "eOverview") {
    const rels = h.relationships || [];
    const facts = h.facts || [];
    let html = "";
    if (rels.length) {
      html += section("Confirmed relationships") + `<div class="grid2">` + rels.map((r) =>
        `<div class="card"><div class="t">${esc(r.source_entity_id === id ? "this entity" : "connected")} —${esc(r.relationship_type)}→ ${esc(r.target_entity_id === id ? "this entity" : "connected")}</div><div class="s">${esc(r.classification)} · ${esc(r.status)}${r.confidence != null ? " · conf " + r.confidence : ""}</div></div>`).join("") + `</div>`;
    }
    if (facts.length) {
      html += section("Confirmed facts") + `<div class="grid2">` + facts.map((f) =>
        `<div class="card"><div class="t">—${esc(f.predicate)}→</div><div class="s">case ${esc(f.case_id ? "linked" : "—")} · event ${esc(f.event_id ? "linked" : "—")}</div></div>`).join("") + `</div>`;
    }
    if (!rels.length && !facts.length) html += emptyState("◎", "No confirmed relationships yet.", `<button class="btn primary sm" onclick="navigate('#/data')">Review pending candidates</button>`);
    try {
      const p = await apiGet("/priority/" + id);
      html += renderPriorityPanel(p);
    } catch (e) { /* entities outside the trusted analytics graph get no score */ }
    body.innerHTML = html;
  } else if (tab === "eTimeline") {
    body.innerHTML = loadingState();
    try {
      const data = await apiGet("/entities/" + id + "/timeline");
      const items = data.items || [];
      body.innerHTML = items.length ? renderTimeline(items) : emptyState("≡", "No dated trusted records for this entity.");
    } catch (err) { body.innerHTML = errorState(err, "loadEntityTab('eTimeline','" + id + "')"); }
  } else if (tab === "eCases") {
    const cases = h.cases || [];
    body.innerHTML = cases.length ? `<div class="grid2">${cases.map((c) => `<div class="card"><div class="t">${esc(c.case_name || "(untitled)")}</div><div class="s mono">${esc(c.official_case_number || "")}</div><div class="s">${esc(c.jurisdiction || "")} · ${esc(c.status || "")}</div><div class="m"><button class="btn sm" onclick="navigate('#/cases/${c.case_id}')">Open case</button></div></div>`).join("")}</div>` : emptyState("◈", "No trusted case associations found.");
  } else if (tab === "eNetwork") {
    body.innerHTML = `<div id="graphPane">${loadingState()}</div>`;
    loadNetworkTab("entity", id, 1, "graphPane");

const PRIO_MAX = { recency: 30, cross_cluster: 25, centrality: 20, case_relevance: 15, source_diversity: 10 };
function renderPriorityPanel(p) {
  const comps = p.breakdown || {};
  const total = Number(p.total);
  return section("Investigation priority") + `<div class="panel">
    <div class="priority-total"><span class="n">${Number.isFinite(total) ? Math.round(total) : "—"}</span><span class="of">/ 100 — analytical review-prioritization signal, not guilt or criminality</span></div>
    ${Object.entries(comps).map(([k, v]) => {
      const max = PRIO_MAX[k] || 20;
      const w = Math.min(100, Math.max(0, ((v && v.score) || 0) / max * 100));
      return `<div class="priority-row"><span class="p-label">${esc(k.replace(/_/g, " "))}</span><div class="priority-bar"><div style="width:${w}%"></div></div><span class="p-val">${v ? (v.score ?? "—") : "—"}</span></div>`;
    }).join("")}
    <div class="confidence-note">${esc(p.disclaimer || "")}</div>
  </div>`;
}

  document.getElementById("pathBtn").addEventListener("click", async () => {
    const a = document.getElementById("pathA").value.trim();
    const b = document.getElementById("pathB").value.trim();
    const out = document.getElementById("pathOut");
    if (!a || !b) { out.innerHTML = '<span class="muted small">Provide both entity ids.</span>'; return; }
    out.innerHTML = loadingState();
    try {
      const p = await apiGet("/graph/path" + qs({ source: a, target: b }));
      if (!p.connected) { out.innerHTML = '<span class="muted small">No trusted path between these entities.</span>'; return; }
      out.innerHTML = `<div class="kv"><b>Connected:</b> yes · <b>Distance:</b> ${p.distance}</div>
        <div class="s mt">${(p.path || []).map((n, i) => `${i ? " → " : ""}<b>${esc(n.name)}</b>`).join("")}</div>
        <div class="s muted">A 2-hop connection is never presented as a direct relationship.</div>`;
    } catch (err) { out.innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
  });
}

/* ---------- 9.9 Timeline ---------- */
function renderTimeline(items) {
  return `<div class="tl">` + items.map((e) => {
    const when = e.date ? `${esc(e.date)} <span class="pill">${esc(e.date_precision || "UNKNOWN")}</span>` : '<span class="pill">date unknown</span>';
    const pub = e.source_publication_date ? ` · published ${esc(e.source_publication_date)}` : "";
    return `<div class="tl-item ${esc(e.kind || "")}">
      <div class="t">${esc(e.title)}</div>
      <div class="d"><b>Event date:</b> ${when}${pub}</div>
      ${e.location ? `<div class="d">Location: ${esc(e.location)}</div>` : ""}
      ${e.case_number ? `<div class="d">Case: ${esc(e.case_number)}</div>` : ""}
    </div>`;
  }).join("") + `</div><div class="muted small mt">Event dates and source publication dates are kept separate. Precision is always shown — approximate dates are never rendered as exact.</div>`;
}

async function pageChanges(container) {
  container.innerHTML = pageHead("What's New", "Trusted-graph change detection · snapshot comparison") +
  `<div class="grid2 mb">
    <div class="panel"><h2>Snapshots</h2>
      <div class="row"><button class="btn primary sm" id="snapCreate">Create snapshot of current trusted graph</button></div>
      <div id="snapList" class="mt">${loadingState()}</div>
    </div>
    <div class="panel"><h2>Compare snapshots</h2>
      <label>Previous snapshot</label><select id="cmpA"></select>
      <label>Current snapshot</label><select id="cmpB"></select>
      <div class="mt"><button class="btn primary sm" id="cmpBtn">Compare</button></div>
      <div id="cmpOut" class="mt"></div>
    </div>
  </div>
  <div class="panel"><h2>Detected changes</h2><div id="chList">${loadingState()}</div></div>`;

  const selA = document.getElementById("cmpA"), selB = document.getElementById("cmpB");
  async function loadSnaps() {
    try {
      const s = await apiGet("/snapshots");
      const snaps = s.items || [];
      document.getElementById("snapList").innerHTML = snaps.length
        ? snaps.map((x) => `<div class="card mb"><div class="row"><span class="pill">v${x.version}</span><span class="muted small">${fmtDT(x.created_at)}</span><span class="muted small">${x.node_count ?? "—"} nodes · ${x.edge_count ?? "—"} edges</span></div><div class="s mono mt">${esc(x.snapshot_id)}</div></div>`).join("")
        : '<span class="muted small">No snapshots yet. Create one to begin change detection.</span>';
      const opts = snaps.map((x) => `<option value="${x.snapshot_id}">v${x.version} — ${fmtDT(x.created_at)}</option>`).join("");
      selA.innerHTML = opts; selB.innerHTML = opts;
    } catch (err) {
      document.getElementById("snapList").innerHTML = `<span class="muted small">${esc(err.message)}</span>`;
    }
  }
  document.getElementById("snapCreate").addEventListener("click", async () => {
    try {
      const s = await apiJSON("POST", "/snapshots", { label: "Snapshot from web UI", created_by: "web-investigator" });
      toast("Snapshot created — version " + s.version + ".", "ok");
      loadSnaps();
    } catch (err) { toast(err.message, "bad"); }
  });
  document.getElementById("cmpBtn").addEventListener("click", async () => {
    const out = document.getElementById("cmpOut");
    if (!selA.value || !selB.value) { out.innerHTML = '<span class="muted small">Select two snapshots.</span>'; return; }
    out.innerHTML = loadingState();
    try {
      const r = await apiJSON("POST", "/changes/compare", { previous_snapshot_id: selA.value, current_snapshot_id: selB.value });
      const ch = r.changes || [];
      out.innerHTML = `<div class="kv"><b>Total changes:</b> ${r.total} (${r.major} major · ${r.moderate} moderate · ${r.minor} minor)</div>` +
        (ch.length ? ch.map((c) => `<div class="card mb"><div class="m"><span class="badge ${esc(c.significance)}">${esc(c.significance)}</span><span class="badge neutral">${esc(c.category)}</span><span class="muted small">${fmtDT(c.created_at)}</span></div><div class="s mt">${esc((c.details && (c.details.name || c.details.title)) || c.category)}</div></div>`).join("") : '<span class="muted small">No differences between these snapshots.</span>');
    } catch (err) { out.innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
  });

  try {
    const d = await apiGet("/changes" + qs({ limit: 200 }));
    const items = d.items || [];
    const el = document.getElementById("chList");
    if (!items.length) { el.innerHTML = emptyState("▲", "No detected changes yet. Create a snapshot, make a trusted change, then compare."); return; }
    const major = items.filter((x) => x.significance === "MAJOR");
    const moderate = items.filter((x) => x.significance === "MODERATE");
    const minor = items.filter((x) => x.significance === "MINOR");
    const group = (label, arr) => arr.length ? section(label) + arr.map(changeCard).join("") : "";
    el.innerHTML = group("Major", major) + group("Moderate", moderate) + group("Minor", minor);
  } catch (err) { document.getElementById("chList").innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
  loadSnaps();
}

function changeOpenAction(c) {
  const ref = c.reference_id || "";
  const sep = ref.indexOf(":");
  if (sep < 0) return "";
  const kind = ref.slice(0, sep), id = ref.slice(sep + 1);
  if (kind === "entity" && id) return `<button class="btn sm" onclick="navigate('#/entities/${id}')">Open entity</button>`;
  if (kind === "case" && id) return `<button class="btn sm" onclick="navigate('#/cases/${id}')">Open case</button>`;
  if (kind === "event" && id) return `<button class="btn sm" onclick="navigate('#/events/${id}')">Open event</button>`;
  return "";
}
function changeCard(c) {
  const summary = (c.details && (c.details.name || c.details.title || c.details.source || c.details.target)) || c.category;
  return `<div class="card mb">
    <div class="m"><span class="badge neutral">${esc(c.category)}</span><span class="badge type">${esc(c.kind || "")}</span><span class="muted small">${fmtDT(c.created_at)}</span></div>
    <div class="s mt">${esc(summary)}${c.reference_id ? ` <span class="muted small mono">${esc(c.reference_id)}</span>` : ""}</div>
    <div class="ch-details"><details><summary>Change details</summary><pre>${esc(JSON.stringify(c.details || {}, null, 2))}</pre></details></div>
    <div class="m">${changeOpenAction(c)}</div>
  </div>`;
}

    navigate("#/data/" + b.dataset.tab);
  });
  loadDataTab(tab);
}
async function loadDataTab(tab) {
  const body = document.getElementById("dataBody");
  if (tab === "upload") {
    body.innerHTML = `<div class="grid2">
      <div class="panel"><h2>Upload document</h2>
        <div class="dropzone" id="dropzone">
          <div class="big">⇪</div>
          <div class="main">Drag & drop a PDF, DOCX or TXT here</div>
          <div class="small muted mt">or click to select a file</div>
        </div>
        <input type="file" id="uploadFile" accept=".pdf,.docx,.txt" class="hidden">
        <div id="uploadFileMeta" class="mt"></div>
        <div class="form-grid">
          <div><label>Publisher</label><input id="uPublisher" placeholder="e.g. Demo Press"></div>
          <div><label>Agency</label><input id="uAgency" placeholder="e.g. Narcotics Control Bureau"></div>
          <div><label>Source type</label><select id="uType"><option value="">— unknown —</option><option>OFFICIAL_GOVERNMENT</option><option>OFFICIAL_POLICE</option><option>OFFICIAL_AGENCY</option><option>COURT_PUBLIC_RECORD</option><option>SECONDARY_SOURCE</option></select></div>
          <div><label>Publication date</label><input id="uPubDate" type="date"></div>
          <div><label>Case number</label><input id="uCaseNo" placeholder="NCB/MUM/123/2026"></div>
          <div><label>Case name</label><input id="uCaseName" placeholder="CASE-001"></div>
        </div>
        <div class="mt"><button class="btn primary" id="uploadBtn" disabled>Upload & process</button></div>
        <div id="uploadResult" class="mt"></div>
      </div>
      <div class="panel"><h2>Processing status</h2>
        <div id="procStats">${loadingState()}</div>
      </div>
    </div>`;
    const dz = document.getElementById("dropzone");
    const fileInput = document.getElementById("uploadFile");
    dz.addEventListener("click", () => fileInput.click());
    dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
    dz.addEventListener("drop", (e) => { e.preventDefault(); dz.classList.remove("drag"); if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener("change", () => { if (fileInput.files.length) selectFile(fileInput.files[0]); });
    function selectFile(f) {
      const ok = /\.(pdf|docx|txt)$/i.test(f.name);
      document.getElementById("uploadFileMeta").innerHTML = `<div class="card"><div class="row"><div class="t">${esc(f.name)}</div><span class="pill">${esc((f.type || "unknown").split("/")[1] || "file")}</span></div><div class="s">${fmtSize(f.size)}</div>${ok ? "" : '<div class="s" style="color:var(--bad)">Unsupported format — use PDF, DOCX or TXT.</div>'}</div>`;
      document.getElementById("uploadBtn").disabled = !ok;
      window.__uploadFile = ok ? f : null;
    }
    document.getElementById("uploadBtn").addEventListener("click", async () => {
      const f = window.__uploadFile;
      if (!f) { toast("Select a valid file first.", "warn"); return; }
      const fd = new FormData();
      fd.append("file", f);
      const set = (id, name) => { const v = document.getElementById(id).value.trim(); if (v) fd.append(name, v); };
      set("uPublisher", "publisher"); set("uAgency", "agency"); set("uType", "source_type"); set("uPubDate", "publication_date"); set("uCaseNo", "case_number"); set("uCaseName", "case_name");
      const btn = document.getElementById("uploadBtn");
      btn.disabled = true; btn.textContent = "Uploading & processing…";
      const res = document.getElementById("uploadResult");
      res.innerHTML = loadingState();
      try {
        const d = await api("/documents/upload", { method: "POST", body: fd });
        res.innerHTML = `<div class="card" style="border-left:3px solid var(--ok)">
          <div class="t">${esc(d.document.filename)}</div>
          <div class="s">Status: ${esc(d.document.processing_status)}</div>
          ${d.duplicate_of ? `<div class="s" style="color:var(--warn)">⚠ Duplicate document detected — original: <span class="mono">${esc(d.duplicate_of)}</span></div>` : ""}
          <div class="s">${esc(d.message || "")}</div>
        </div>`;
        toast(d.duplicate_of ? "Uploaded — duplicate detected." : "Document uploaded and processed.", d.duplicate_of ? "warn" : "ok");
        loadProcStats();
      } catch (err) {
        res.innerHTML = `<div class="state" style="padding:14px">${esc(err.message)}</div>`;
      } finally { btn.disabled = false; btn.textContent = "Upload & process"; }
    });
    loadProcStats();
  } else if (tab === "documents") {
    body.innerHTML = `<div class="panel"><div class="row">
      <select id="docStatus" style="max-width:220px"><option value="">All statuses</option><option>UPLOADED</option><option>PROCESSING</option><option>PROCESSED</option><option>REVIEW_REQUIRED</option><option>FAILED</option></select>
      <button class="btn primary sm" id="docLoad">Apply</button>
    </div><div id="docList" class="mt">${loadingState()}</div></div>`;
    async function load() {
      const box = document.getElementById("docList");
      box.innerHTML = loadingState();
      try {
        const d = await apiGet("/documents" + qs({ status: document.getElementById("docStatus").value, limit: 200 }));
        const items = d.items || [];
        if (!items.length) { box.innerHTML = emptyState("📄", "No documents yet.", `<button class="btn primary sm" onclick="navigate('#/data/upload')">Upload a document</button>`); return; }
        box.innerHTML = `<div class="muted small mb">${d.total} document(s)</div><div style="overflow-x:auto"><table class="list">
          <tr><th>Filename</th><th>Type</th><th>Size</th><th>Status</th><th>Uploaded</th><th>Duplicate of</th></tr>
          ${items.map((x) => `<tr><td>${esc(x.filename)}</td><td>${esc(x.file_type)}</td><td>${fmtSize(x.file_size)}</td><td>${statusBadge(x.processing_status)}</td><td>${fmtDT(x.upload_timestamp)}</td><td class="mono small">${x.duplicate_of_document_id ? esc(x.duplicate_of_document_id) : "—"}</td></tr>`).join("")}
        </table></div>`;
      } catch (err) { box.innerHTML = errorState(err, "renderRoute()"); }
    }
    document.getElementById("docLoad").addEventListener("click", load);
    load();
  } else if (tab === "review") {
    body.innerHTML = `<div class="panel"><div class="row">
      <select id="revStatus" style="max-width:200px"><option value="">All statuses</option><option selected>PENDING</option><option>EDITED</option><option>CONFIRMED</option><option>REJECTED</option></select>
      <select id="revType" style="max-width:220px"><option value="">All types</option><option>ENTITY</option><option>LOCATION</option><option>EVENT</option><option>RELATIONSHIP</option><option>FACT</option><option>CASE_MATCH</option><option>CLAIM</option></select>
      <button class="btn primary sm" id="revApply">Apply filters</button>
    </div>
    <div class="trusted-note mt">
      <span><span class="trust-chip candidate">CANDIDATE</span> awaiting human review — not yet trusted</span>
      <span><span class="trust-chip trusted">CONFIRMED</span> became trusted records</span>
      <span>Confirmation/rejection uses the real candidate APIs only — no local fake state.</span>
    </div>
    <div id="revList" class="mt">${loadingState()}</div></div>`;
    async function load() {
      const box = document.getElementById("revList");
      box.innerHTML = loadingState();
      try {
        const d = await apiGet("/candidates" + qs({ status: document.getElementById("revStatus").value, candidate_type: document.getElementById("revType").value, limit: 200 }));
        const items = d.items || [];
        if (!items.length) { box.innerHTML = emptyState("🗂", "No candidates match these filters."); return; }
        box.innerHTML = items.map((c) => candCard(c)).join("");
      } catch (err) { box.innerHTML = errorState(err, "renderRoute()"); }
    }
    document.getElementById("revApply").addEventListener("click", load);
    load();
  }
}
async function loadProcStats() {
  const el = document.getElementById("procStats");
  if (!el) return;
  try {
    const d = await apiGet("/documents" + qs({ limit: 200 }));
    const items = d.items || [];
    const count = (s) => items.filter((x) => x.processing_status === s).length;
    el.innerHTML = `<div class="kv"><b>Documents:</b> ${d.total}</div>
      <div class="kv"><b>Processed:</b> ${count("PROCESSED")}</div>
      <div class="kv"><b>Review required:</b> ${count("REVIEW_REQUIRED")}</div>
      <div class="kv"><b>Failed:</b> ${count("FAILED")}</div>
      <div class="kv"><b>Duplicates:</b> ${items.filter((x) => x.duplicate_of_document_id).length}</div>
      <div class="muted small mt">Processing counts come from the backend document records — they are never invented here.</div>`;
  } catch (err) { el.innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
}

/* ---------- 9.14 Settings ---------- */
