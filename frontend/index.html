      }
    } else {
      for (const e of data.edges) activeEdges.add(e.id);
    }
    window.__netActiveNodes = activeNodes;
    window.__netActiveEdges = activeEdges;
    const banner = document.getElementById("gfBanner");
    banner.style.display = "";
    banner.innerHTML = `<span class="filter-active">FILTER ACTIVE</span> <span class="muted">${[f.entityType ? "Entity Type: " + esc(f.entityType) : "", f.status ? "Status: " + esc(f.status) : "", f.relType ? "Relationship: " + esc(f.relType) : "", f.search ? "Search: “" + esc(f.search) + "”" : ""].filter(Boolean).join(" · ")}</span> <span class="muted">· ${activeNodes.size} matching node(s)</span> <button class="btn ghost sm" onclick="window.__clearCaseFilters()">Clear filters</button>`;
    renderCaseGraph();
  }
  function hideFilterBanner() {
    document.getElementById("gfBanner").style.display = "none";
  }
  function clearCaseFilters() {
    window.__netFilters = {};
    document.getElementById("gfEntityType").value = "";
    document.getElementById("gfStatus").value = "";
    document.getElementById("gfRelSelect").value = "";
    document.getElementById("gfSearch").value = "";
    hideFilterBanner();
    renderCaseGraph();
  }
  window.__clearCaseFilters = clearCaseFilters;
  // BFS distances from the center over the TRUSTED edge set — the depth
  // control and the peripheral band both derive from real connectivity,
  // never from entity type (REQ 16-18).
  function netBfsDist(data, centerId) {
    const adj = new Map();
    (data.edges || []).forEach((e) => {
      if (!adj.has(e.source)) adj.set(e.source, new Set());
      if (!adj.has(e.target)) adj.set(e.target, new Set());
      adj.get(e.source).add(e.target);
      adj.get(e.target).add(e.source);
    });
    const dist = new Map([[centerId, 0]]);
    const q = [centerId];
    while (q.length) {
      const u = q.shift();
      const du = dist.get(u) + 1;
      (adj.get(u) || []).forEach((v) => {
        if (!dist.has(v)) { dist.set(v, du); q.push(v); }
      });
    }
    return dist;
  }
  function netIsContextual(n) {
    const ist = String(n.investigative_status || "").toUpperCase();
    const mctx = String(n.mention_context || "").toUpperCase();
    return ist === "CONTEXTUAL" || mctx === "CONTEXTUAL" || (n.node_kind === "entity" && ist === "MENTIONED_ONLY");
  }
  // Shortest path (BFS) from the center to a node over the VISIBLE edge
  // set — returns node/edge id sets plus the readable path for the
  // details drawer. Paths are real trusted connections, never invented.
  function netPathFromCenter(data, edges, centerId, targetId) {
    const adj = new Map(); const eid = new Map();
    edges.forEach((e) => {
      for (const [a, b] of [[e.source, e.target], [e.target, e.source]]) {
        if (!adj.has(a)) adj.set(a, []);
        adj.get(a).push(b);
        if (!eid.has(a + "|" + b)) eid.set(a + "|" + b, e.id);
      }
    });
    const prev = new Map([[centerId, null]]);
    const q = [centerId];
    while (q.length) {
      const u = q.shift();
      if (u === targetId) break;
      (adj.get(u) || []).forEach((v) => { if (!prev.has(v)) { prev.set(v, u); q.push(v); } });
    }
    if (!prev.has(targetId)) return null;
    const nodeIds = []; let cur = targetId;
    while (cur !== null) { nodeIds.unshift(cur); cur = prev.get(cur); }
    const edgeIds = [];
    for (let i = 0; i < nodeIds.length - 1; i++) edgeIds.push(eid.get(nodeIds[i] + "|" + nodeIds[i + 1]));
    const nodeNames = new Map(); data.nodes.forEach((n) => nodeNames.set(n.id, n.name));
    const edgeTypes = new Map(); edges.forEach((e) => edgeTypes.set(e.id, e.relationship_type));
    return {
      node: targetId,
      nodes: new Set(nodeIds),
      edges: new Set(edgeIds),
      path: nodeIds.map((id) => ({ id, name: nodeNames.get(id) || id })),
      edgePath: edgeIds.map((id) => ({ id, type: edgeTypes.get(id) || "" })),
    };
  }
  // Node click in case mode: select the node (highlight the path from the
  // center) and let the shared drawer open its details (REQ 12, 28-29).
  window.selectNetNode = (gid, refId) => {
    if (!window.__netCaseData) return;
    if (window.__netCenter && gid === window.__netCenter.id) { clearNetSelection(); return; }
    window.__netSel = { id: gid, refId: refId || "" };
    renderCaseGraph();
  };
  function clearNetSelection() {
    window.__netSel = null;
    window.__netSelPath = null;
    renderCaseGraph();
  }
  window.clearNetSelection = clearNetSelection;
  // Depth control (REQ 18): a real BFS traversal rebuild — 1 hop = direct
  // relationships only, 2 hops = + one indirect layer, 3 hops = + two.
  window.setNetDepth = (d) => {
    window.__netDepth = d;
    document.querySelectorAll("#graphPane .depth").forEach((b) => b.classList.toggle("active", +b.dataset.d === d));
    renderCaseGraph();
  };
  function renderCaseGraph() {
    const data = window.__netCaseData;
    if (!data) return;
    const f = window.__netFilters || {};
    const hasFilter = !!(f.entityType || f.status || f.relType || f.search);
    const center = window.__netCenter;
    const depth = window.__netDepth || 2;
    const tgl = window.__netToggles || { direct: true, indirect: true, contextual: true };
    // Depth = actual graph traversal: nodes within `depth` hops stay in
    // the rings; nodes beyond depth are hidden for this view; nodes with
    // NO path to the center stay in the peripheral band — never deleted,
    // never connected (REQ 14, 18).
    const dist = netBfsDist(data, center.id);
    let visNodes = data.nodes.filter((n) => n.id === center.id || (dist.has(n.id) && dist.get(n.id) <= depth) || !dist.has(n.id));
    if (!tgl.contextual) visNodes = visNodes.filter((n) => n.id === center.id || !netIsContextual(n));
    const visIds = new Set(visNodes.map((n) => n.id));
    let visEdges = (data.edges || []).filter((e) => visIds.has(e.source) && visIds.has(e.target));
    // View toggles (REQ 19): hide direct (center-touching) or indirect
    // edges — a visualization filter only, trusted data is untouched.
    if (!tgl.direct) visEdges = visEdges.filter((e) => e.source !== center.id && e.target !== center.id);
    if (!tgl.indirect) visEdges = visEdges.filter((e) => e.source === center.id || e.target === center.id);
    // Selection: shortest trusted path from the center to the chosen node.
    let sel = null;
    if (window.__netSel && window.__netSel.id && visIds.has(window.__netSel.id)) {
      sel = netPathFromCenter(data, visEdges, center.id, window.__netSel.id);
    }
    window.__netSelPath = sel ? { path: sel.path, edgePath: sel.edgePath } : null;
    renderGraphSVG({ nodes: visNodes, edges: visEdges, center: data.center }, "graphPane-svg", {
      center,
      filterActive: hasFilter,
      activeNodes: hasFilter ? (window.__netActiveNodes || new Set()) : null,
      activeEdges: hasFilter ? (window.__netActiveEdges || new Set()) : null,
      directness: true,
      selectable: true,
      selNodes: sel ? sel.nodes : null,
      selEdges: sel ? sel.edges : null,
    });
    // Live header: centered node, node/edge counts for the CURRENT view,
    // depth and any active selection (REQ 17).
    const ctr = document.getElementById("netGraphCtr");
    if (ctr) ctr.innerHTML = `Centered on: <b>${esc(center.name || "")}</b> <span class="pill">${esc(center.type || "CASE")}</span>`;
    const stt = document.getElementById("netGraphStats");
    if (stt) stt.textContent = `${visNodes.length} nodes · ${visEdges.length} relationships · depth ${depth}${sel ? ` · path: ${sel.path.length} nodes` : ""}`;
  }
  window.__renderCaseGraph = renderCaseGraph;
  document.getElementById("gfStatus").disabled = true; // case-mode only
  document.getElementById("netCaseOpen").addEventListener("click", () => {
    const v = document.getElementById("netCaseSelect").value;
    if (v) loadCaseGraph(v);
  });
  document.getElementById("netCaseCenterReset").addEventListener("click", () => {
    if (!window.__netCase || !window.__netCaseData) return;
    const data = window.__netCaseData;
    window.__netCenter = { id: data.center.id, name: data.center.name, type: "CASE", kind: "case" };
    renderCurrentCenter();
    renderCaseGraph();
    toast("View returned to the case root.", "ok");
  });
  populateCaseSelect();

  // ---------- analytics scope (REQ 12-14): Current Case is the default;
  // global analysis is an explicit opt-in — never a silent mix ----------
  function currentScope() {
    const mode = (document.querySelector('input[name="anaScope"]:checked') || {}).value || "case";
    if (mode === "global") return { scope: "global", caseId: null };
    return { scope: "case", caseId: window.__netCase ? window.__netCase.id : null };
  }
  function anaQ() { const sc = currentScope(); return sc.caseId ? qs({ case_id: sc.caseId }) : ""; }

  async function loadNetStatsTab() {
    const box = document.getElementById("netStats");
    if (!box) return;
    const sc = currentScope();
    if (sc.scope === "case" && !sc.caseId) {
      box.innerHTML = '<span class="muted small">Select a case to explore its network — statistics are scoped to the selected case.</span>';
      return;
    }
    box.innerHTML = loadingState();
    try {
      const s = await apiGet("/graph/stats" + anaQ());
      const byT = Object.entries(s.nodes_by_type || {}).map(([t, c]) => `<div class="kv"><b>${esc(t)}:</b> ${c}</div>`).join("");
      box.innerHTML = `<div class="ana-scope-line mb">Scope: <b>${sc.scope === "case" ? "current case" : "entire database"}</b>${sc.caseId ? ` · <span class="mono">${esc(sc.caseId)}</span>` : ""}</div>
        <div class="kv"><b>Total nodes:</b> ${s.total_nodes}</div><div class="kv"><b>Total edges:</b> ${s.total_edges}</div>` + (byT || '<span class="muted small">Empty trusted graph.</span>');
    } catch (err) { box.innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
  }

  // components (accordion, lazy) — REQ 19/20
  window.netComponentLabel = (x) => {
    const nodes = x.nodes || [];
    const names = nodes.map((n) => n.name).filter(Boolean);
    if (names.length <= 1) return names[0] || `Component ${x.component_id}`;
    // A meaningful label from the entities actually contained in the
    // component: prefer a real entity node over event/case descriptions.
    const entityNode = nodes.find((n) => n.node_kind === "entity" && n.name) || nodes.find((n) => n.name);
    return `${entityNode ? entityNode.name : names[0]} Network`;
  };
  async function loadNetComponentsTab() {
    const box = document.getElementById("netComponents");
    if (!box) return;
    const sc = currentScope();
    if (sc.scope === "case" && !sc.caseId) { box.innerHTML = '<span class="muted small">Select a case to explore its network.</span>'; return; }
    box.innerHTML = loadingState();
    try {
      const c = await apiGet("/graph/analytics/components" + anaQ());
      const comps = c.components || [];
      box.innerHTML = comps.length
        ? comps.map((x) => `<div class="card" style="display:inline-block;margin:0 8px 8px 0;min-width:210px;vertical-align:top">
            <div class="t">${esc(window.netComponentLabel(x))}</div>
            <div class="s">${x.node_count} nodes · ${x.edge_count} relationships</div>
            <div class="s">${Object.entries(x.dominant_entity_types || {}).map(([t, n]) => `${esc(t)} ${n}`).join(" · ")}</div>
            <div class="s muted">Connected component — a connectivity grouping, never a determination of criminality.</div></div>`).join("")
        : '<span class="muted small">No trusted components (empty graph).</span>';
    } catch (err) { box.innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
  }

  // clusters (accordion, lazy) — REQ 15-18
  async function loadNetClustersTab() {
    const box = document.getElementById("netClusters");
    if (!box) return;
    const sc = currentScope();
    if (sc.scope === "case" && !sc.caseId) { box.innerHTML = '<span class="muted small">Select a case to explore its network.</span>'; return; }
    box.innerHTML = loadingState();
    try {
      const c = await apiGet("/graph/analytics/clusters" + anaQ());
      const cls = c.clusters || [];
      box.innerHTML = cls.length
        ? cls.map((x, i) => {
            const geo = x.geographic_distribution || [];
            // Meaningful subtitle derived from real contained entities
            // (REQ 18) — never invented semantic names.
            const sub = geo.length ? geo[0] + " Network" : (x.associated_cases || []).length ? "Case-scoped network" : `Cluster ${i + 1}`;
            return `<div class="card mb"><div class="t">Network Cluster ${i + 1} <span class="muted small">· ${esc(sub)}</span></div>
              <div class="s">${x.node_count} nodes · ${x.edge_count} relationships</div>
              <div class="s">Dominant types: ${Object.entries(x.dominant_entity_types || {}).map(([t, n]) => `${esc(t)} ${n}`).join(" · ")}</div>
              <div class="s">Case: ${(x.associated_cases || []).map((id) => esc(id.split(":").pop())).join(", ") || "—"}</div>
              <div class="s">Geography: ${geo.map(esc).join(", ") || "—"}</div>
              <div class="s muted">A cluster is a network-analysis grouping — never a determination of criminality.</div></div>`;
          }).join("")
        : '<span class="muted small">No network clusters detected.</span>';
    } catch (err) { box.innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
  }

  // location network (accordion, lazy) — REQ 21-28, trusted data only
  async function loadNetLocationsTab() {
    const box = document.getElementById("netLocations");
    if (!box) return;
    const sc = currentScope();
    if (sc.scope === "case" && !sc.caseId) { box.innerHTML = '<span class="muted small">Select a case to explore its location network.</span>'; return; }
    if (sc.scope === "global" || !sc.caseId) {
      box.innerHTML = '<span class="muted small">Location Network is a per-case analysis — select a case to open it.</span>';
      return;
    }
    box.innerHTML = loadingState();
    try {
      const loc = await apiGet(`/graph/case/${sc.caseId}/locations`);
      const nm = {};
      ((window.__netCaseData && window.__netCaseData.nodes) || []).forEach((n) => { nm[n.id] = n.name; });
      const lnames = (loc.locations || []).map((n) => n.name).filter(Boolean);
      let html =
        `<div class="kv"><b>Total locations:</b> ${loc.total_locations}</div>
         <div class="kv"><b>Explicit location relationships:</b> ${loc.total_location_relationships}</div>
         <div class="kv"><b>Events with explicit locations:</b> ${loc.total_events_with_locations}</div>
         <div class="mt"><b>Locations:</b> ${lnames.map(esc).join(", ") || "—"}</div>`;
      // Explicit location relationships — never inferred proximity edges.
      html += (loc.location_relationships || []).length
        ? `<div class="mt"><b>Explicit location relationships</b><div class="mt">${loc.location_relationships.map((e) => `<div class="kv">${esc(nm[e.source] || e.source)} — <b>${esc(e.relationship_type)}</b> → ${esc(nm[e.target] || e.target)}</div>`).join("")}</div></div>`
        : '<div class="mt muted small">No explicit location relationships found for this case — declared locations are shown as nodes only, no edges are fabricated.</div>';
      html += (loc.events_with_locations || []).length
        ? `<div class="mt"><b>Events with locations</b><div class="mt">${loc.events_with_locations.map((ev) => `<div class="kv">${esc(ev.event_name)} <span class="pill">${esc(ev.event_type)}</span> → ${esc(ev.location_name)}</div>`).join("")}</div></div>`
        : '<div class="mt muted small">No events with an explicit location link in this case.</div>';
      // Compact location graph (fit in its own container, never clipped).

      if (locNodes.length) {
        html += `<div class="mt"><b>Location graph</b><div class="graph-wrap" id="netLocGraph" style="height:360px"></div></div>`;
      }
      box.innerHTML = html;
      if (locNodes.length) {
        renderGraphSVG({ nodes: locNodes, edges: locEdges, center: locNodes[0] }, "netLocGraph", { isMini: true });
      }
    } catch (err) { box.innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
  }

  // ---------- accordion behaviour (REQ 30-32): independent, keyboard
  // accessible, lazy-rendered ----------
  function bindAccordion(id) {
    const head = document.getElementById(id);
    if (!head) return;
    head.addEventListener("click", () => {
      const body = document.getElementById(head.dataset.body);
      const open = body.hidden;
      body.hidden = !open;
      head.setAttribute("aria-expanded", String(open));
      const arrow = head.querySelector(".acc-arrow");
      if (arrow) arrow.textContent = open ? "▼" : "▶";
      if (open) {
        const fn = window[head.dataset.load];
        if (typeof fn === "function") fn();
      }
    });
  }
  bindAccordion("accNetClusters");
  bindAccordion("accNetComponents");
  bindAccordion("accNetLocations");
  document.querySelectorAll(".acc-head").forEach((h) => {
    h.setAttribute("tabindex", "0");
    h.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); h.click(); }
    });
  });

  window.loadNetStatsTab = loadNetStatsTab;
  window.loadNetComponentsTab = loadNetComponentsTab;
  window.loadNetClustersTab = loadNetClustersTab;
  window.loadNetLocationsTab = loadNetLocationsTab;

  // Analysis-scope radios: switching scope re-renders the visible sections
  // (Current Case is the default — no silent global mixing, REQ 14).
  document.querySelectorAll('input[name="anaScope"]').forEach((r) => {
    r.addEventListener("change", () => {
      loadNetStatsTab();
      ["accNetClusters", "accNetComponents", "accNetLocations"].forEach((id) => {
        const head = document.getElementById(id);
        if (head && !document.getElementById(head.dataset.body).hidden && window[head.dataset.load]) window[head.dataset.load]();
      });
    });
  });
  // Called when a case loads/clears so the visible sections stay scoped.
  function refreshScopedAnalytics() {
    loadNetStatsTab();
    ["accNetClusters", "accNetComponents", "accNetLocations"].forEach((id) => {
      const head = document.getElementById(id);
      if (head && !document.getElementById(head.dataset.body).hidden && window[head.dataset.load]) window[head.dataset.load]();
    });
  }
  window.__refreshScopedAnalytics = refreshScopedAnalytics;
  loadNetStatsTab();

  // shortest path
  document.getElementById("pathBtn").addEventListener("click", async () => {
    const a = document.getElementById("pathA").value.trim();
    const b = document.getElementById("pathB").value.trim();
    const out = document.getElementById("pathOut");
    if (!a || !b) { out.innerHTML = '<span class="muted small">Provide both entity ids.</span>'; return; }
    out.innerHTML = loadingState();
    try {
      const p = await apiGet("/graph/path" + qs({ source: a, target: b }));
      if (!p.connected) { out.innerHTML = '<span class="muted small">No trusted path between these entities.</span>'; return; }
      out.innerHTML = `<div class="kv"><b>Connected:</b> yes · <b>Distance:</b> ${p.distance}</div>
        <div class="s mt">${(p.path || []).map((n, i) => `${i ? " → " : ""}<b>${esc(n.name)}</b>`).join("")}</div>
        <div class="s muted">A 2-hop connection is never presented as a direct relationship.</div>`;
    } catch (err) { out.innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
  });
}

/* ---------- 9.9 Timeline ---------- */
function renderTimeline(items) {
  return `<div class="tl">` + items.map((e) => {
    const when = e.date ? `${esc(e.date)} <span class="pill">${esc(e.date_precision || "UNKNOWN")}</span>` : '<span class="pill">date unknown</span>';
    const pub = e.source_publication_date ? ` · published ${esc(e.source_publication_date)}` : "";
    return `<div class="tl-item ${esc(e.kind || "")}">
      <div class="t">${esc(e.title)}</div>
      <div class="d"><b>Event date:</b> ${when}${pub}</div>
      ${e.location ? `<div class="d">Location: ${esc(e.location)}</div>` : ""}
      ${e.case_number ? `<div class="d">Case: ${esc(e.case_number)}</div>` : ""}
    </div>`;
  }).join("") + `</div><div class="muted small mt">Event dates and source publication dates are kept separate. Precision is always shown — approximate dates are never rendered as exact.</div>`;
}
async function pageTimeline(container) {
  container.innerHTML = pageHead("Timeline", "Trusted timeline — event dates vs publication dates") +
  `<div class="panel"><div class="form-grid">
    <div><label>Case</label><select id="tlCase"><option value="">All cases (global)</option></select></div>
    <div><label>Event type</label><select id="tlType"><option value="">All</option><option>OPERATION</option><option>ARREST</option><option>SEIZURE</option><option>RAID</option><option>INVESTIGATION</option><option>SEARCH</option><option>COURT_PROCEEDING</option><option>INTERCEPTION</option><option>OTHER</option></select></div>
    <div><label>Location</label><input id="tlLoc" placeholder="e.g. Mumbai"></div>
    <div><label>Date from</label><input id="tlFrom" type="date"></div>
    <div><label>Date to</label><input id="tlTo" type="date"></div>
    <div style="align-self:end"><button class="btn primary sm" id="tlApply">Apply filters</button></div>
  </div></div>
  <div id="tlBody">${loadingState()}</div>`;
  try {
    const d = await apiGet("/cases" + qs({ limit: 200 }));
    const sel = document.getElementById("tlCase");
    sel.innerHTML = `<option value="">All cases (global)</option>` + (d.items || []).map((c) =>
      `<option value="${c.case_id}">${esc(c.case_name || c.official_case_number || c.case_id)}</option>`).join("");
  } catch (e) { /* case list unavailable — global timeline still works */ }
  async function load() {
    const body = document.getElementById("tlBody");
    body.innerHTML = loadingState();
    try {
      const caseId = document.getElementById("tlCase").value;
      const data = caseId
        ? await apiGet("/timeline/case/" + caseId)
        : await apiGet("/timeline/global" + qs({
            event_type: document.getElementById("tlType").value,
            location: document.getElementById("tlLoc").value.trim(),
            date_from: document.getElementById("tlFrom").value,
            date_to: document.getElementById("tlTo").value,

      body.innerHTML = items.length ? `<div class="muted small mb">${items.length} dated record(s)</div>` + renderTimeline(items) : emptyState("≡", "No timeline records match the current filters.");
    } catch (err) { body.innerHTML = errorState(err, "renderRoute()"); }
  }
  document.getElementById("tlApply").addEventListener("click", load);
  load();
}

/* ---------- 9.10 What's New (changes) ---------- */
async function pageChanges(container) {
  container.innerHTML = pageHead("What's New", "Trusted-graph change detection · snapshot comparison") +
  `<div class="grid2 mb">
    <div class="panel"><h2>Snapshots</h2>
      <div class="row"><button class="btn primary sm" id="snapCreate">Create snapshot of current trusted graph</button></div>
      <div id="snapList" class="mt">${loadingState()}</div>
    </div>
    <div class="panel"><h2>Compare snapshots</h2>
      <label>Previous snapshot</label><select id="cmpA"></select>
      <label>Current snapshot</label><select id="cmpB"></select>
      <div class="mt"><button class="btn primary sm" id="cmpBtn">Compare</button></div>
      <div id="cmpOut" class="mt"></div>
    </div>
  </div>
  <div class="panel"><h2>Detected changes</h2><div id="chList">${loadingState()}</div></div>`;

  const selA = document.getElementById("cmpA"), selB = document.getElementById("cmpB");
  async function loadSnaps() {
    try {
      const s = await apiGet("/snapshots");
      const snaps = s.items || [];
      document.getElementById("snapList").innerHTML = snaps.length
        ? snaps.map((x) => `<div class="card mb"><div class="row"><span class="pill">v${x.version}</span><span class="muted small">${fmtDT(x.created_at)}</span><span class="muted small">${x.node_count ?? "—"} nodes · ${x.edge_count ?? "—"} edges</span></div><div class="s mono mt">${esc(x.snapshot_id)}</div></div>`).join("")
        : '<span class="muted small">No snapshots yet. Create one to begin change detection.</span>';
      const opts = snaps.map((x) => `<option value="${x.snapshot_id}">v${x.version} — ${fmtDT(x.created_at)}</option>`).join("");
      selA.innerHTML = opts; selB.innerHTML = opts;
    } catch (err) {
      document.getElementById("snapList").innerHTML = `<span class="muted small">${esc(err.message)}</span>`;
    }
  }
  document.getElementById("snapCreate").addEventListener("click", async () => {
    try {
      const s = await apiJSON("POST", "/snapshots", { label: "Snapshot from web UI", created_by: "web-investigator" });
      toast("Snapshot created — version " + s.version + ".", "ok");
      loadSnaps();
    } catch (err) { toast(err.message, "bad"); }
  });
  document.getElementById("cmpBtn").addEventListener("click", async () => {
    const out = document.getElementById("cmpOut");
    if (!selA.value || !selB.value) { out.innerHTML = '<span class="muted small">Select two snapshots.</span>'; return; }
    out.innerHTML = loadingState();
    try {
      const r = await apiJSON("POST", "/changes/compare", { previous_snapshot_id: selA.value, current_snapshot_id: selB.value });
      const ch = r.changes || [];
      out.innerHTML = `<div class="kv"><b>Total changes:</b> ${r.total} (${r.major} major · ${r.moderate} moderate · ${r.minor} minor)</div>` +
        (ch.length ? ch.map((c) => `<div class="card mb"><div class="m"><span class="badge ${esc(c.significance)}">${esc(c.significance)}</span><span class="badge neutral">${esc(c.category)}</span><span class="muted small">${fmtDT(c.created_at)}</span></div><div class="s mt">${esc((c.details && (c.details.name || c.details.title)) || c.category)}</div></div>`).join("") : '<span class="muted small">No differences between these snapshots.</span>');
    } catch (err) { out.innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
  });

  try {
    const d = await apiGet("/changes" + qs({ limit: 200 }));
    const items = d.items || [];
    const el = document.getElementById("chList");
    if (!items.length) { el.innerHTML = emptyState("▲", "No detected changes yet. Create a snapshot, make a trusted change, then compare."); return; }
    const major = items.filter((x) => x.significance === "MAJOR");
    const moderate = items.filter((x) => x.significance === "MODERATE");
    const minor = items.filter((x) => x.significance === "MINOR");
    const group = (label, arr) => arr.length ? section(label) + arr.map(changeCard).join("") : "";
    el.innerHTML = group("Major", major) + group("Moderate", moderate) + group("Minor", minor);
  } catch (err) { document.getElementById("chList").innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
  loadSnaps();
}

function changeOpenAction(c) {
  const ref = c.reference_id || "";
  const sep = ref.indexOf(":");
  if (sep < 0) return "";
  const kind = ref.slice(0, sep), id = ref.slice(sep + 1);
  if (kind === "entity" && id) return `<button class="btn sm" onclick="navigate('#/entities/${id}')">Open entity</button>`;
  if (kind === "case" && id) return `<button class="btn sm" onclick="navigate('#/cases/${id}')">Open case</button>`;
  if (kind === "event" && id) return `<button class="btn sm" onclick="navigate('#/events/${id}')">Open event</button>`;
  return "";
}
function changeCard(c) {
  const summary = (c.details && (c.details.name || c.details.title || c.details.source || c.details.target)) || c.category;
  return `<div class="card mb">
    <div class="m"><span class="badge neutral">${esc(c.category)}</span><span class="badge type">${esc(c.kind || "")}</span><span class="muted small">${fmtDT(c.created_at)}</span></div>
    <div class="s mt">${esc(summary)}${c.reference_id ? ` <span class="muted small mono">${esc(c.reference_id)}</span>` : ""}</div>
    <div class="ch-details"><details><summary>Change details</summary><pre>${esc(JSON.stringify(c.details || {}, null, 2))}</pre></details></div>
    <div class="m">${changeOpenAction(c)}</div>
  </div>`;
}

        if (!items.length) { box.innerHTML = emptyState("📄", "No documents yet.", `<button class="btn primary sm" onclick="navigate('#/data/upload')">Upload a document</button>`); return; }
        box.innerHTML = `<div class="muted small mb">${d.total} document(s)</div><div style="overflow-x:auto"><table class="list">
          <tr><th>Filename</th><th>Type</th><th>Size</th><th>Status</th><th>Validation</th><th>Uploaded</th><th>Duplicate of</th></tr>
          ${items.map((x) => {
            const issues = x.structured_validation || [];
            const valCell = issues.length
              ? `<span class="pill" style="background:rgba(255,170,60,.15);color:var(--warn)" title="${esc(issues.map((i) => i.id + ': ' + i.message).join(' | '))}">⚠ ${issues.length} issue${issues.length > 1 ? "s" : ""}</span>`
              : "—";
            return `<tr><td>${esc(x.filename)}</td><td>${esc(x.file_type)}</td><td>${fmtSize(x.file_size)}</td><td>${statusBadge(x.processing_status)}</td><td>${valCell}</td><td>${fmtDT(x.upload_timestamp)}</td><td class="mono small">${x.duplicate_of_document_id ? esc(x.duplicate_of_document_id) : "—"}</td></tr>`;
          }).join("")}
        </table></div>`;
      } catch (err) { box.innerHTML = errorState(err, "renderRoute()"); }
    }
    document.getElementById("docLoad").addEventListener("click", load);
    load();
  } else if (tab === "review") {
    body.innerHTML = `<div class="panel"><div class="row">
      <select id="revStatus" style="max-width:200px"><option value="">All statuses</option><option selected>PENDING</option><option>EDITED</option><option>CONFIRMED</option><option>REJECTED</option></select>
      <select id="revType" style="max-width:220px"><option value="">All types</option><option>ENTITY</option><option>LOCATION</option><option>EVENT</option><option>RELATIONSHIP</option><option>FACT</option><option>CASE_MATCH</option><option>CLAIM</option></select>
      <button class="btn primary sm" id="revApply">Apply filters</button>
    </div>
    <div class="trusted-note mt">
      <span><span class="trust-chip candidate">CANDIDATE</span> awaiting human review — not yet trusted</span>
      <span><span class="trust-chip trusted">CONFIRMED</span> became trusted records</span>
      <span>Confirmation/rejection uses the real candidate APIs only — no local fake state.</span>
    </div>
    <div id="revList" class="mt">${loadingState()}</div></div>`;
    async function load() {
      const box = document.getElementById("revList");
      box.innerHTML = loadingState();
      try {
        const d = await apiGet("/candidates" + qs({ status: document.getElementById("revStatus").value, candidate_type: document.getElementById("revType").value, limit: 200 }));
        const items = d.items || [];
        if (!items.length) { box.innerHTML = emptyState("🗂", "No candidates match these filters."); return; }
        box.innerHTML = items.map((c) => candCard(c)).join("");
      } catch (err) { box.innerHTML = errorState(err, "renderRoute()"); }
    }
    document.getElementById("revApply").addEventListener("click", load);
    load();
  } else if (tab === "duplicates") {
    // Duplicate review (REQ 85-96): type-aware detection, three explicit
    // states (CONFIRMED SAME / POSSIBLE DUPLICATE / CONFIRMED DISTINCT),
    // and an audited merge that repoints every reference — nothing is
    // silently merged and nothing is deleted.
    body.innerHTML = `<div class="panel"><h2>Data quality — duplicate records</h2>
      <div id="dupSummary" class="mt">${loadingState()}</div>
      <div class="row mt">
        <select id="dupFilter" style="max-width:220px" aria-label="Data quality filter"><option value="">All</option><option value="possible">Possible duplicates</option><option value="confirmed">Confirmed same</option><option value="superseded">Superseded records</option></select>
        <select id="dupKind" style="max-width:220px" aria-label="Record type"><option value="">All record types</option><option value="entity">Entities</option><option value="case">Cases</option><option value="case_entity">CASE entity vs Case</option></select>
        <button class="btn primary sm" id="dupLoad">Apply filter</button>
      </div>
      <div class="trusted-note mt">
        <span>Merging/reconciliation is an explicit, audited decision. <b>CONFIRMED SAME</b> applies only to high-confidence deterministic matches (e.g. identical ENTITY_ID or a document anchored to the case). Anything ambiguous is <b>POSSIBLE DUPLICATE</b> for your review — the system never silently merges identity.</span>
      </div>
      <div id="dupList" class="mt">${loadingState()}</div></div>`;
    async function loadSummary() {
      const box = document.getElementById("dupSummary");
      try {
        const s = await apiGet("/duplicates/summary");
        box.innerHTML = `<div class="kpis">
          <div class="kpi"><div class="num">${s.total_records ?? "—"}</div><div class="lab">Total active records</div></div>
          <div class="kpi amber"><div class="num">${s.possible_duplicate_groups ?? "—"}</div><div class="lab">Possible duplicate groups</div></div>
          <div class="kpi"><div class="num">${s.confirmed_same_groups ?? "—"}</div><div class="lab">Confirmed same (deterministic)</div></div>
          <div class="kpi purple"><div class="num">${s.case_entity_reconciliation_groups ?? "—"}</div><div class="lab">CASE entity ↔ Case reconciliations</div></div>
          <div class="kpi green"><div class="num">${s.merged_records ?? "—"}</div><div class="lab">Merged / superseded</div></div>
          <div class="kpi"><div class="num">${s.keep_separate_decisions ?? "—"}</div><div class="lab">Keep-separate decisions</div></div>
        </div>`;
      } catch (err) { box.innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
    }
    async function load() {
      const box = document.getElementById("dupList");
      box.innerHTML = loadingState();
      const filter = document.getElementById("dupFilter").value;
      const kind = document.getElementById("dupKind").value;
      // Superseded records: merged entities remain queryable for
      // provenance (they never appear in active graphs/stats).
      if (filter === "superseded") {
        try {
          const e = await apiGet("/entities" + qs({ status: "MERGED", limit: 200 }));
          const items = e.items || [];
          box.innerHTML = items.length
            ? items.map((x) => `<div class="card mb"><div class="row"><div class="t">${esc(x.canonical_name)}</div><span class="pill">${esc(x.entity_type)}</span><span class="pill trusted">MERGED</span></div>
                <div class="s mono small">${esc(x.entity_id)}${x.merged_into_id ? ` · merged into <b>${esc(x.merged_into_id)}</b>` : ""}${x.merged_into_case_id ? ` · reconciled into case <b>${esc(x.merged_into_case_id)}</b>` : ""}</div>
                <div class="s muted">Superseded record — preserved for provenance, excluded from the active graph.</div></div>`).join("")
            : emptyState("✓", "No superseded records.");
          return;
        } catch (err) { box.innerHTML = `<span class="muted small">${esc(err.message)}</span>`; return; }
      }
      try {
        const d = await apiGet("/duplicates" + qs({ kind }));
        let groups = d.groups || [];
        if (filter === "possible") groups = groups.filter((g) => g.classification === "POSSIBLE_DUPLICATE");
        if (filter === "confirmed") groups = groups.filter((g) => g.classification === "CONFIRMED_SAME");
        if (!groups.length) {
          box.innerHTML = emptyState("✓", "No duplicate records match these filters — names/types are normalized and checked deterministically.");
          return;
        }
        box.innerHTML = groups.map((g) => {
          if (g.kind === "case_entity") {
            const r = (g.records || [])[0] || {};
            return `<div class="card mb"><div class="row"><div class="t">CASE entity ↔ Case</div>
              <span class="pill ${g.classification === "CONFIRMED_SAME" ? "trusted" : ""}">${esc(g.classification)}</span><span class="pill">CASE</span></div>
              <div class="s mt"><b>Canonical Case:</b> ${esc((g.case || {}).name || "")} <span class="mono small">(${esc((g.case || {}).record_id || "")})</span></div>
              <div class="s"><b>Legacy entity:</b> ${esc(r.name || "")} <span class="mono small">(${esc(r.record_id || "")})</span>${r.source_document_id ? ` · doc <span class="mono small">${esc(r.source_document_id)}</span>` : ""}</div>
              <div class="s muted">Same logical Case: the legacy CASE-typed entity is the relationship-endpoint record created before case resolution existed.</div>
              <div class="drawer-actions">
                <button class="btn ok sm" onclick="reconcileCaseEntity('${esc(r.record_id)}','${esc((g.case || {}).record_id)}')">Reconcile with Case</button>
                <button class="btn ghost sm" onclick="keepDupSeparate('case_entity','${esc(r.record_id)}','${esc((g.case || {}).record_id)}')">Keep separate</button>
              </div>
              <div class="s muted">Reconciliation marks the legacy entity MERGED into the canonical Case — every relationship and its provenance are preserved and the graph keeps ONE case node.</div></div>`;
          }
          return `<div class="card mb">
            <div class="row"><div class="t">${esc(g.canonical_name)}</div>
              <span class="pill ${g.classification === "CONFIRMED_SAME" ? "trusted" : ""}">${esc(g.classification)}</span>
              <span class="pill">${esc(g.kind)}${g.entity_type ? " · " + esc(g.entity_type) : ""}</span></div>
            <div class="s mt">${g.records.length} record(s) — ${g.similarity != null ? "similarity " + esc(String(g.similarity)) : ""}</div>
            <div class="mt">${g.records.map((r) => `<div class="kv mono small">${esc(r.name)} <span class="muted">· ${esc(r.record_id)}</span>${r.source_document_id ? ` · doc <span class="muted">${esc(r.source_document_id)}</span>` : ""}${r.structured_id ? ` · <b>${esc(r.structured_id)}</b>` : ""}</div>`).join("")}</div>
            <div class="drawer-actions">
              <button class="btn ok sm" onclick="mergeDupPair('${g.kind}','${g.records[0].record_id}','${g.records[1].record_id}')" ${g.records.length > 2 ? "disabled title=\"Merge available for pairs\"" : ""}>Merge into canonical</button>
              <button class="btn ghost sm" onclick="keepDupSeparate('${g.kind}','${g.records[0].record_id}','${g.records[1].record_id}')">Keep separate</button>
            </div>
            <div class="s muted">Merging repoints every relationship/fact/event reference to the canonical record, marks the duplicate MERGED and preserves all provenance — nothing is deleted.</div>
          </div>`;
        }).join("");
      } catch (err) { box.innerHTML = errorState(err, "load()"); }
    }
    document.getElementById("dupLoad").addEventListener("click", load);
    loadSummary();
    load();
  }
}

// Global duplicate actions (merge / keep separate) — explicit human review.
window.mergeDupPair = async (kind, canonicalId, duplicateId) => {
  if (!confirm("Merge the duplicate into the canonical record? This repoints all references and preserves provenance. This action cannot be undone by the UI.")) return;
  try {
    const r = await apiJSON("POST", "/duplicates/" + kind + "s/merge", {
      canonical_id: canonicalId,
      duplicate_id: duplicateId,
      reviewed_by: "web-investigator",
      reason: "Confirmed same via duplicate review",
    });
    toast("Merged: " + (r.merged_id || ""), "ok");
    renderRoute();
  } catch (err) { toast(err.message, "bad"); }
};
// Reconcile a CASE-typed entity into its canonical Case (explicit human
// review). The entity is marked MERGED (never an independent record), all
// relationships and their provenance are preserved, and the graph keeps
// ONE canonical CASE node.
window.reconcileCaseEntity = async (entityId, caseId) => {
  if (!confirm("Reconcile this legacy CASE entity into the canonical Case? Its relationships and provenance are preserved and the graph keeps ONE case node. This cannot be undone by the UI.")) return;
  try {
    const r = await apiJSON("POST", "/duplicates/case-entity/reconcile", {
      entity_id: entityId,
      case_id: caseId,
      reviewed_by: "web-investigator",
      reason: "CASE-typed entity confirmed as the canonical Case",
    });
    toast("Reconciled into case " + (r.case_id || ""), "ok");
    renderRoute();
  } catch (err) { toast(err.message, "bad"); }
};
window.keepDupSeparate = async (kind, recordA, recordB) => {
  if (!confirm("Mark these records as CONFIRMED DISTINCT so they are no longer flagged as duplicates?")) return;
  try {
    await apiJSON("POST", "/duplicates/keep-separate", {
      kind,
      record_a_id: recordA,
      record_b_id: recordB,
      reviewed_by: "web-investigator",
      reason: "Confirmed distinct via duplicate review",
    });
    toast("Records confirmed distinct.", "ok");
    renderRoute();
  } catch (err) { toast(err.message, "bad"); }
};
async function loadProcStats() {
  const el = document.getElementById("procStats");
  if (!el) return;
  try {
    const d = await apiGet("/documents" + qs({ limit: 200 }));
    const items = d.items || [];
    const count = (s) => items.filter((x) => x.processing_status === s).length;
    el.innerHTML = `<div class="kv"><b>Documents:</b> ${d.total}</div>
      <div class="kv"><b>Processed:</b> ${count("PROCESSED")}</div>
      <div class="kv"><b>Review required:</b> ${count("REVIEW_REQUIRED")}</div>
      <div class="kv"><b>Failed:</b> ${count("FAILED")}</div>
      <div class="kv"><b>Duplicates:</b> ${items.filter((x) => x.duplicate_of_document_id).length}</div>
      <div class="muted small mt">Processing counts come from the backend document records — they are never invented here.</div>`;
  } catch (err) { el.innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
}

/* ---------- 9.15 Saved Searches ---------- */
let __ssLoadList = null;
function renderQueryResults(r) {
  let html = "";
  const group = (label, arr, rowHtml) => arr && arr.length ? `<div class="ss-result-group">${label}</div>` + arr.map(rowHtml).join("") : "";
  html += group("People", r.people, (e) => `<div class="ss-row"><button class="btn ghost sm" onclick="navigate('#/entities/${e.entity_id}')">${esc(e.canonical_name)}</button><span class="ss-sub">${esc(e.status || "")}</span></div>`);
  html += group("Organizations", r.organizations, (e) => `<div class="ss-row"><button class="btn ghost sm" onclick="navigate('#/entities/${e.entity_id}')">${esc(e.canonical_name)}</button><span class="ss-sub">${esc(e.entity_type || "")}</span></div>`);
  html += group("Locations", r.locations, (e) => `<div class="ss-row"><button class="btn ghost sm" onclick="navigate('#/entities/${e.entity_id}')">${esc(e.canonical_name)}</button><span class="ss-sub">${esc(e.status || "")}</span></div>`);
  html += group("Cases", r.cases, (c) => `<div class="ss-row"><button class="btn ghost sm" onclick="navigate('#/cases/${c.case_id}')">${esc(c.case_name || c.official_case_number || "(case)")}</button><span class="ss-sub">${esc(c.official_case_number || "")} ${esc(c.status || "")}</span></div>`);
  html += group("Events", r.events, (ev) => `<div class="ss-row"><button class="btn ghost sm" onclick="navigate('#/events/${ev.event_id}')">${esc(ev.title)}</button><span class="ss-sub">${esc(ev.event_type || "")}${ev.date_precision ? " · " + esc(ev.date_precision) : ""}${ev.start_date ? " · " + esc(ev.start_date) : ""}</span></div>`);
  html += group("Documents", r.documents, (d) => `<div class="ss-row"><span class="ss-name">${esc(d.filename)}</span><span class="ss-sub">${esc(d.processing_status || "")}</span></div>`);
  if (!html) html = '<span class="muted small">No results for this query.</span>';
  return html;
}
async function pageSavedSearches(container) {
  container.innerHTML = pageHead("Saved Searches", "Persisted investigation queries — re-run through the one backend query engine") +
  `<div class="grid2 mb">
    <div class="panel"><h2>Save a search</h2>
      <label>Name</label><input id="ssName" placeholder="e.g. Events in Pune, Jan–Jun 2026">
      <label>Query text (q)</label><input id="ssQ" placeholder="e.g. Desai — or leave empty to filter only">
      <div class="form-grid">
        <div><label>Entity type</label><select id="ssEntityType"><option value="">Any</option><option>PERSON</option><option>ORGANIZATION</option><option>AGENCY</option><option>LOCATION</option></select></div>
        <div><label>Event type</label><select id="ssEventType"><option value="">Any</option><option>OPERATION</option><option>ARREST</option><option>SEIZURE</option><option>RAID</option><option>INVESTIGATION</option><option>SEARCH</option><option>COURT_PROCEEDING</option><option>INTERCEPTION</option><option>OTHER</option></select></div>
        <div><label>Location</label><input id="ssLocation" placeholder="e.g. Pune"></div>
        <div><label>Case number</label><input id="ssCaseNo" placeholder="e.g. NCB/MUM/123/2026"></div>
        <div><label>Date from</label><input id="ssFrom" type="date"></div>
        <div><label>Date to</label><input id="ssTo" type="date"></div>
      </div>
      <div class="mt"><button class="btn primary sm" id="ssSave">Save search</button></div>
    </div>
    <div class="panel"><h2>Saved searches</h2><div id="ssList">${loadingState()}</div></div>
  </div>
  <div class="panel"><h2>Run results</h2><div id="ssRunOut">${emptyState("⌕", "Press RUN AGAIN on a saved search to execute it against current trusted data.")}</div></div>`;

  document.getElementById("ssSave").addEventListener("click", async () => {
    const name = document.getElementById("ssName").value.trim();
    if (!name) { toast("Search name is required.", "warn"); return; }
    const filters = {
      q: document.getElementById("ssQ").value.trim() || null,
      entity_type: document.getElementById("ssEntityType").value || null,
      event_type: document.getElementById("ssEventType").value || null,
      location: document.getElementById("ssLocation").value.trim() || null,
      case_number: document.getElementById("ssCaseNo").value.trim() || null,
      date_from: document.getElementById("ssFrom").value || null,
      date_to: document.getElementById("ssTo").value || null,
    };
    Object.keys(filters).forEach((k) => { if (!filters[k]) delete filters[k]; });
    try {
      await apiJSON("POST", "/saved-searches", { name, filters, created_by: "web-investigator" });
      toast("Search saved.", "ok");
      if (__ssLoadList) __ssLoadList();
    } catch (err) { toast(err.message, "bad"); }
  });

  async function loadList() {
    const box = document.getElementById("ssList");
    box.innerHTML = loadingState();
    try {
      const d = await apiGet("/saved-searches");
      const items = d.items || [];
      if (!items.length) { box.innerHTML = emptyState("⌕", "No saved searches yet. Build one on the left."); return; }
      box.innerHTML = items.map((s) => `<div class="card mb">
        <div class="row"><div class="t">${esc(s.name)}</div><span class="muted small">${fmtDT(s.created_at)}</span></div>
        <div class="s mono">${esc(JSON.stringify(s.filters || {}))}</div>
        <div class="m">
          <button class="btn ok sm" onclick="runSavedSearch('${s.saved_search_id}')">RUN AGAIN</button>
          <button class="btn bad sm" onclick="deleteSavedSearch('${s.saved_search_id}')">Delete</button>
        </div>
      </div>`).join("");
    } catch (err) { box.innerHTML = errorState(err, "renderRoute()"); }
  }
  __ssLoadList = loadList;

  window.runSavedSearch = async (id) => {
    const out = document.getElementById("ssRunOut");
    out.innerHTML = loadingState();
    try {
      const r = await apiGet("/saved-searches/" + id + "/run");
      out.innerHTML = renderQueryResults(r);
    } catch (err) { out.innerHTML = errorState(err, "renderRoute()"); }
  };
  window.deleteSavedSearch = async (id) => {
    try { await api("/saved-searches/" + id, { method: "DELETE" }); toast("Saved search deleted.", "warn"); if (__ssLoadList) __ssLoadList(); }
    catch (err) { toast(err.message, "bad"); }
  };
  loadList();
}
