  container.innerHTML = pageHead("Settings", "Application status") + `<div class="panel"><h2>Backend status</h2><div id="settingsBody">${loadingState()}</div></div>`;
  const el = document.getElementById("settingsBody");
  try {
    const h = await apiGet("/health");
    el.innerHTML = `<div class="settings-row"><span>Service</span><span class="v">${esc(h.status || "unknown")}</span></div>
      <div class="settings-row"><span>Database</span><span class="v">${esc(h.database || "unknown")}</span></div>
      <div class="settings-row"><span>AI provider</span><span class="v">${esc(h.ai_provider || "none")}${h.ai_enabled ? " (enabled)" : " (deterministic mode)"}</span></div>
      <div class="settings-row"><span>Version</span><span class="v">${esc(h.version || "—")}</span></div>
      <div class="muted small mt">The application runs in deterministic mode without external AI. No credentials are stored or exposed in this interface.</div>`;
  } catch (err) { el.innerHTML = `<span class="muted small">${esc(err.message)}</span>`; }
}

/* ---------- 9.15 Saved Searches ---------- */
let __ssLoadList = null;
function renderQueryResults(r) {
  let html = "";
  const group = (label, arr, rowHtml) => arr && arr.length ? `<div class="ss-result-group">${label}</div>` + arr.map(rowHtml).join("") : "";
  html += group("People", r.people, (e) => `<div class="ss-row"><button class="btn ghost sm" onclick="navigate('#/entities/${e.entity_id}')">${esc(e.canonical_name)}</button><span class="ss-sub">${esc(e.status || "")}</span></div>`);
  html += group("Organizations", r.organizations, (e) => `<div class="ss-row"><button class="btn ghost sm" onclick="navigate('#/entities/${e.entity_id}')">${esc(e.canonical_name)}</button><span class="ss-sub">${esc(e.entity_type || "")}</span></div>`);
  html += group("Locations", r.locations, (e) => `<div class="ss-row"><button class="btn ghost sm" onclick="navigate('#/entities/${e.entity_id}')">${esc(e.canonical_name)}</button><span class="ss-sub">${esc(e.status || "")}</span></div>`);
  html += group("Cases", r.cases, (c) => `<div class="ss-row"><button class="btn ghost sm" onclick="navigate('#/cases/${c.case_id}')">${esc(c.case_name || c.official_case_number || "(case)")}</button><span class="ss-sub">${esc(c.official_case_number || "")} ${esc(c.status || "")}</span></div>`);
  html += group("Events", r.events, (ev) => `<div class="ss-row"><button class="btn ghost sm" onclick="navigate('#/events/${ev.event_id}')">${esc(ev.title)}</button><span class="ss-sub">${esc(ev.event_type || "")}${ev.date_precision ? " · " + esc(ev.date_precision) : ""}${ev.start_date ? " · " + esc(ev.start_date) : ""}</span></div>`);
  html += group("Documents", r.documents, (d) => `<div class="ss-row"><span class="ss-name">${esc(d.filename)}</span><span class="ss-sub">${esc(d.processing_status || "")}</span></div>`);
  if (!html) html = '<span class="muted small">No results for this query.</span>';
  return html;
}
async function pageSavedSearches(container) {
  container.innerHTML = pageHead("Saved Searches", "Persisted investigation queries — re-run through the one backend query engine") +
  `<div class="grid2 mb">
    <div class="panel"><h2>Save a search</h2>
      <label>Name</label><input id="ssName" placeholder="e.g. Events in Pune, Jan–Jun 2026">
      <label>Query text (q)</label><input id="ssQ" placeholder="e.g. Desai — or leave empty to filter only">
      <div class="form-grid">
        <div><label>Entity type</label><select id="ssEntityType"><option value="">Any</option><option>PERSON</option><option>ORGANIZATION</option><option>AGENCY</option><option>LOCATION</option></select></div>
        <div><label>Event type</label><select id="ssEventType"><option value="">Any</option><option>OPERATION</option><option>ARREST</option><option>SEIZURE</option><option>RAID</option><option>INVESTIGATION</option><option>SEARCH</option><option>COURT_PROCEEDING</option><option>INTERCEPTION</option><option>OTHER</option></select></div>
        <div><label>Location</label><input id="ssLocation" placeholder="e.g. Pune"></div>
        <div><label>Case number</label><input id="ssCaseNo" placeholder="e.g. NCB/MUM/123/2026"></div>
        <div><label>Date from</label><input id="ssFrom" type="date"></div>
        <div><label>Date to</label><input id="ssTo" type="date"></div>
      </div>
      <div class="mt"><button class="btn primary sm" id="ssSave">Save search</button></div>
    </div>
    <div class="panel"><h2>Saved searches</h2><div id="ssList">${loadingState()}</div></div>
  </div>
  <div class="panel"><h2>Run results</h2><div id="ssRunOut">${emptyState("⌕", "Press RUN AGAIN on a saved search to execute it against current trusted data.")}</div></div>`;

  document.getElementById("ssSave").addEventListener("click", async () => {
    const name = document.getElementById("ssName").value.trim();
    if (!name) { toast("Search name is required.", "warn"); return; }
    const filters = {
      q: document.getElementById("ssQ").value.trim() || null,
      entity_type: document.getElementById("ssEntityType").value || null,
      event_type: document.getElementById("ssEventType").value || null,
      location: document.getElementById("ssLocation").value.trim() || null,
      case_number: document.getElementById("ssCaseNo").value.trim() || null,
      date_from: document.getElementById("ssFrom").value || null,
      date_to: document.getElementById("ssTo").value || null,
    };
    Object.keys(filters).forEach((k) => { if (!filters[k]) delete filters[k]; });
    try {
      await apiJSON("POST", "/saved-searches", { name, filters, created_by: "web-investigator" });
      toast("Search saved.", "ok");
      if (__ssLoadList) __ssLoadList();
    } catch (err) { toast(err.message, "bad"); }
  });

  async function loadList() {
    const box = document.getElementById("ssList");
    box.innerHTML = loadingState();
    try {
      const d = await apiGet("/saved-searches");
      const items = d.items || [];
      if (!items.length) { box.innerHTML = emptyState("⌕", "No saved searches yet. Build one on the left."); return; }
      box.innerHTML = items.map((s) => `<div class="card mb">
        <div class="row"><div class="t">${esc(s.name)}</div><span class="muted small">${fmtDT(s.created_at)}</span></div>
        <div class="s mono">${esc(JSON.stringify(s.filters || {}))}</div>
        <div class="m">
          <button class="btn ok sm" onclick="runSavedSearch('${s.saved_search_id}')">RUN AGAIN</button>
          <button class="btn bad sm" onclick="deleteSavedSearch('${s.saved_search_id}')">Delete</button>
        </div>
      </div>`).join("");
    } catch (err) { box.innerHTML = errorState(err, "renderRoute()"); }
  }
  __ssLoadList = loadList;

  window.runSavedSearch = async (id) => {
    const out = document.getElementById("ssRunOut");
    out.innerHTML = loadingState();
    try {
      const r = await apiGet("/saved-searches/" + id + "/run");
      out.innerHTML = renderQueryResults(r);
    } catch (err) { out.innerHTML = errorState(err, "renderRoute()"); }
  };
  window.deleteSavedSearch = async (id) => {
    try { await api("/saved-searches/" + id, { method: "DELETE" }); toast("Saved search deleted.", "warn"); if (__ssLoadList) __ssLoadList(); }
    catch (err) { toast(err.message, "bad"); }
  };
  loadList();
}
